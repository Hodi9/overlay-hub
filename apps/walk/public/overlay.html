<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marcel Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@500;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14111c;--panel-a:rgba(36,30,52,.94);--panel-b:rgba(17,13,25,.95);--panel2:rgba(255,255,255,.06);--lilac:#c7b6ff;--pink:#ff9ac4;--red:#e8334a;--cream:#fff8ec;--muted:#a99fbf;--line:rgba(255,255,255,.12);--glow:rgba(199,182,255,.45)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Schibsted Grotesk",system-ui,sans-serif;color:var(--cream)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .panel{background:linear-gradient(160deg,var(--panel-a),var(--panel-b));border:1.5px solid var(--line);border-radius:28px;box-shadow:0 24px 60px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(10px)}
  .bar{height:16px;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--pink));box-shadow:0 0 18px var(--glow);transition:width 1s}
  .pill{display:inline-block;padding:7px 16px;border-radius:99px;background:linear-gradient(180deg,#f2495f,#cf2a40);box-shadow:0 6px 16px -6px rgba(232,51,74,.8),inset 0 1px 0 rgba(255,255,255,.35);font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:22px;white-space:nowrap}
  .pill.pause{background:linear-gradient(180deg,#f6c35b,#d9972a);color:#2a1b00;box-shadow:0 6px 16px -6px rgba(217,151,42,.8),inset 0 1px 0 rgba(255,255,255,.45)}
  .pbars{display:inline-block;width:13px;height:16px;margin-right:8px;vertical-align:-2px;border-left:4.5px solid currentColor;border-right:4.5px solid currentColor}
  /* Pause: blød gul ramme + et lille PAUSE-mærke på overlayets kant (dækker ikke noget) */
  .panel.is-paused{border-color:rgba(246,195,91,.85);animation:pausering 2.8s ease-in-out infinite}
  @keyframes pausering{0%,100%{box-shadow:0 24px 60px -18px rgba(0,0,0,.7),0 0 0 0 rgba(246,195,91,0)}50%{box-shadow:0 24px 60px -18px rgba(0,0,0,.7),0 0 0 5px rgba(246,195,91,.3)}}
  .pausetab{position:absolute;z-index:10;transform:translate(-50%,-50%) scale(var(--sc,1));display:flex;align-items:center;gap:12px;padding:5px 22px 5px 18px;border-radius:99px;background:linear-gradient(180deg,#f6c35b,#d9972a);color:#2a1b00;font-weight:800;font-size:26px;letter-spacing:.14em;box-shadow:0 8px 22px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.45);animation:pausefade 2.8s ease-in-out infinite}
  .pausetab .pbars{width:13px;height:19px;margin:0;border-left-width:5px;border-right-width:5px}
  @keyframes pausefade{50%{opacity:.8}}
  .pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .muted{color:var(--muted)}
  .arrow{color:var(--lilac);margin:0 .28em}
  .eyebrow{font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* v1 — bundbar */
  .v1{position:absolute;left:40px;right:40px;bottom:36px;padding:24px 34px 22px}
  .v1 .row{display:flex;gap:36px;align-items:center}.v1 .mid{flex:1;min-width:0}
  .v1 .day{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .v1 .route{font-size:44px;font-weight:800;letter-spacing:-.01em}.v1 .sub{font-size:24px;color:var(--muted);margin-top:4px}
  .v1 .bar{margin-top:14px}
  .v1 .tot{text-align:right}.v1 .tot b{font-size:50px}.v1 .tot span{font-size:24px;color:var(--muted)}
  .v1 .trail{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:20px}
  .v1 .trail i{height:10px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
  .v1 .trail i.done{background:var(--lilac);box-shadow:0 0 10px var(--glow)}.v1 .trail i.cur::after{content:"";position:absolute;inset:0;width:var(--p);background:linear-gradient(90deg,var(--lilac),var(--pink))}

  /* v2 — hjørnekort */
  .v2{position:absolute;left:40px;top:40px;width:600px;overflow:hidden}
  .v2 .head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 26px;background:var(--panel2);border-bottom:1.5px solid var(--line)}
  .v2 .head b{font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:var(--lilac);white-space:nowrap;min-width:0}
  .v2 .pills{flex:none;flex-wrap:nowrap}.v2 .pill{font-size:19px;padding:6px 14px}
  .v2 .body{padding:22px 26px 22px}
  .v2 .route{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-.01em}.v2 .via{font-size:22px;color:var(--muted);margin-top:6px}
  .v2 .bar{margin-top:18px}
  .v2 .stay,.v2 .pace{margin-top:14px;font-size:21px;color:var(--muted)}
  .v2 .pace{margin-top:10px}.v2 .pace b{color:var(--cream)}
  .v2 .eta-line{margin-top:6px;color:var(--cream);font-weight:700}
  .v2 .stay{margin-top:6px}
  .v2 .stats{display:grid;border-top:1.5px solid var(--line);background:var(--panel2)}
  .v2 .stats div{padding:14px 20px;border-right:1px solid var(--line);min-width:0}.v2 .stats div:last-child{border:0}
  .v2 .stats span{display:block;font-size:19px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.v2 .stats b{font-size:30px;white-space:nowrap}

  /* kort (v3 + v5) */
  svg.map{display:block;width:100%;height:auto;border-radius:18px;background:radial-gradient(ellipse at 50% 35%,#272046 0,#171230 70%,#120e24 100%)}
  .land{fill:rgba(199,182,255,.2);stroke:rgba(199,182,255,.5);stroke-linejoin:round}
  .land2{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.14);stroke-linejoin:round}
  .seg{fill:none;stroke:rgba(255,255,255,.28);stroke-linecap:round;stroke-linejoin:round}
  .seg.done{stroke:var(--pink);filter:drop-shadow(0 0 4px rgba(255,154,196,.7))}.seg.train{stroke-dasharray:1 2.4;stroke-width:inherit}
  .town{fill:var(--ink);stroke:#d9d0ec}.town.done{stroke:var(--pink);fill:var(--pink)}
  .tname{font-family:"Schibsted Grotesk",sans-serif;font-weight:700;fill:var(--cream);paint-order:stroke;stroke:rgba(20,17,28,.95);stroke-linejoin:round}
  .me{fill:var(--red);stroke:#fff}.me,.pulse{transition:cx 1s linear,cy 1s linear}.pulse{fill:none;stroke:var(--red);animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.6)}}

  /* v3 — kort */
  .v3{position:absolute;right:40px;bottom:40px;width:760px;overflow:hidden}
  .v3 .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 26px}
  .v3 .top .route{font-size:36px;font-weight:800;letter-spacing:-.01em}
  .v3 .mapbox{padding:0 14px 14px;position:relative}
  .mapchip{position:absolute;left:30px;bottom:30px;padding:8px 16px;border-radius:99px;background:rgba(20,17,28,.85);border:1.5px solid var(--line);font-size:21px;font-weight:700;backdrop-filter:blur(6px)}
  .v3 .stats{display:grid;border-top:1.5px solid var(--line);background:var(--panel2)}
  .v3 .stats div{padding:14px 26px;border-right:1px solid var(--line)}.v3 .stats div:last-child{border:0}
  .v3 .stats span{display:block;font-size:19px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.v3 .stats b{font-size:36px;white-space:nowrap}
  .v3 .stats.four div{padding:14px 18px}.v3 .stats.four b{font-size:29px}

  /* v4 — tidslinje */
  .v4{position:absolute;left:40px;top:40px;bottom:40px;width:480px;padding:22px 24px;display:flex;flex-direction:column}
  .v4 h1{margin:0 0 4px;font-size:32px;letter-spacing:-.01em}.v4 .sum{font-size:22px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .v4 .sum{column-gap:16px;row-gap:4px}.v4 .sum span{white-space:nowrap}
  .v4 .sum .pill{font-size:17px;padding:4px 12px}
  .v4 ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
  .v4 li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:14px;font-size:21px;white-space:nowrap;font-weight:600;color:var(--muted)}
  .v4 li .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:19px;font-weight:800}
  .v4 li.done{opacity:.55}.v4 li.done .n{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}
  .v4 li.cur{background:var(--panel2);border:1.5px solid var(--lilac);box-shadow:0 0 22px -6px var(--glow);color:var(--cream);padding:11px 10px}
  .v4 li.cur .n{background:var(--red);border-color:var(--red);color:#fff}
  .v4 li .km{font-size:20px;color:var(--muted)}
  .v4 li.cur .prog{grid-column:2/4;height:8px;margin-top:2px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .v4 li.cur .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink))}
  .v4 .total{margin-top:12px}.v4 .total .bar{height:12px}.v4 .total div:first-child{display:flex;justify-content:space-between;font-size:22px;margin-bottom:8px}

  /* v5 — verdenskort + Danmark */
  .v5{position:absolute;right:40px;bottom:40px;width:1340px;padding:18px;display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:stretch}
  .v5.nomap{grid-template-columns:1fr}
  .v5 .dkmap svg.map{height:640px}
  .v5 aside{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0;height:640px;overflow:hidden}
  .v5 .worldbox{position:relative;border-radius:18px;overflow:hidden;height:122px;flex:none}
  .v5 .worldbox svg{height:100%;width:100%}
  .v5 .worldbox .cap{position:absolute;left:12px;bottom:8px;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);text-shadow:0 1px 6px #000}
  .world-land{fill:rgba(199,182,255,.26);stroke:rgba(199,182,255,.45);stroke-width:.6;stroke-linejoin:round}
  .world-dk{fill:var(--red);stroke:#fff;stroke-width:1.2}
  .grat{fill:none;stroke:rgba(255,255,255,.07);stroke-width:.7}
  .v5 .info{padding:2px 8px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
  .v5 .info .ttl{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .v5 .info .ttl .eyebrow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;letter-spacing:.1em}
  .v5 .route{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.01em}.v5 .sub{font-size:20px;color:var(--muted)}
  .v5 .kmrow{display:flex;justify-content:space-between;align-items:baseline;font-size:22px}.v5 .kmrow b{font-size:40px}
  .v5 .sub.next b{color:var(--cream);font-weight:700}
  .v5 .etabox{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px}
  .v5 .etabox span{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.v5 .etabox b{font-size:32px;white-space:nowrap}
  .v1 .eta{color:var(--cream)}
  .v5 .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .v5 .stats div{background:var(--panel2);border-radius:12px;padding:6px 12px}
  .v5 .stats span{display:block;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.v5 .stats b{font-size:25px;white-space:nowrap}
  /* lysstyrke: et sort lag over panelets indhold (bevarer den slørede baggrund bag panelet) */
  .panel::before{content:"";position:absolute;inset:0;background:#000;opacity:calc(1 - var(--bri,1));pointer-events:none;border-radius:inherit;z-index:4}
  /* tema "Kun tekst + grå boks": halvgennemsigtig grå boks, hvid tekst med mørk kant og skygge */
  #stage[data-look="mg"]{--panel-a:rgba(26,28,36,.55);--panel-b:rgba(26,28,36,.55);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.28);--cream:#fff;--muted:rgba(255,255,255,.86);--lilac:#fff;--pink:#fff;--glow:rgba(255,255,255,.25)}
  #stage[data-look="mg"] .panel{background:rgba(26,28,36,.55);border-radius:22px;box-shadow:0 14px 36px -12px rgba(0,0,0,.55);backdrop-filter:blur(14px) saturate(1.15);text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9),1px 0 0 rgba(0,0,0,.6),-1px 0 0 rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.6),0 -1px 0 rgba(0,0,0,.6),0 3px 12px rgba(0,0,0,.55)}
  #stage[data-look="mg"] .pill{background:none;box-shadow:none;border-radius:0;padding:0 0 4px;border-bottom:2px solid #fff;letter-spacing:.2em;color:#fff}
  #stage[data-look="mg"] .bar{height:8px;background:rgba(255,255,255,.3);box-shadow:none}
  #stage[data-look="mg"] .bar>i{background:#fff;box-shadow:none}
  #stage[data-look="mg"] svg.map{background:rgba(12,14,20,.38)}
  #stage[data-look="mg"] .land{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.8)}
  #stage[data-look="mg"] .land2{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.25)}
  #stage[data-look="mg"] .seg{stroke:rgba(255,255,255,.5)}
  #stage[data-look="mg"] .seg.done{stroke:#fff;filter:none}
  #stage[data-look="mg"] .town{fill:#111;stroke:#fff}#stage[data-look="mg"] .town.done{fill:#fff}
  #stage[data-look="mg"] .tname{stroke:rgba(0,0,0,.8)}
  #stage[data-look="mg"] .me{fill:#fff;stroke:#111}#stage[data-look="mg"] .pulse{stroke:#fff}
  #stage[data-look="mg"] .v4 li.done .n{color:#111}
  #stage[data-look="mg"] .v4 li.cur{box-shadow:none;border-color:rgba(255,255,255,.8)}
  #stage[data-look="mg"] .v4 li.cur .n{background:#fff;color:#111;border-color:#fff}
  #stage[data-look="mg"] .v4 li.cur .prog i{background:#fff}
  #stage[data-look="mg"] .world-land{fill:rgba(255,255,255,.2);stroke:rgba(255,255,255,.6)}
  #stage[data-look="mg"] .world-dk{fill:#fff;stroke:#111}
  #stage[data-look="mg"] .v5 .etabox{border-color:rgba(255,255,255,.3)}
  /* tema "Nordlys": dyb blå-sort med grønt og violet skær og blød glød */
  #stage[data-look="nl"]{--ink:#06182a;--panel-a:rgba(9,33,49,.9);--panel-b:rgba(6,16,30,.92);--panel2:rgba(92,242,181,.07);--lilac:#5cf2b5;--pink:#4aa8ff;--red:#a78bfa;--cream:#eafff7;--muted:#86b4ad;--line:rgba(92,242,181,.28);--glow:rgba(92,242,181,.5);font-family:"Sora",system-ui,sans-serif}
  #stage[data-look="nl"] .panel{border-color:rgba(92,242,181,.4);border-radius:22px;box-shadow:0 0 50px -10px rgba(92,242,181,.35),0 24px 50px -20px #000}
  #stage[data-look="nl"] .pill{background:linear-gradient(90deg,#5cf2b5,#4aa8ff);color:#04201a;box-shadow:0 6px 16px -6px rgba(92,242,181,.6)}
  #stage[data-look="nl"] .bar>i{background:linear-gradient(90deg,#5cf2b5,#4aa8ff,#a78bfa)}
  #stage[data-look="nl"] .v2 .head{background:linear-gradient(90deg,rgba(92,242,181,.16),rgba(167,139,250,.12))}
  #stage[data-look="nl"] .route{letter-spacing:-.03em}
  #stage[data-look="nl"] .v5 .info .ttl .eyebrow{font-size:16px;letter-spacing:.05em}
  #stage[data-look="nl"] svg.map{background:radial-gradient(ellipse at 30% 20%,#12375a 0,#07182a 60%,#050f1d 100%)}
  #stage[data-look="nl"] .land{fill:rgba(92,242,181,.13);stroke:rgba(92,242,181,.45)}
  #stage[data-look="nl"] .land2{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.12)}
  #stage[data-look="nl"] .seg{stroke:rgba(134,180,173,.4)}
  #stage[data-look="nl"] .seg.done{stroke:#5cf2b5;filter:drop-shadow(0 0 6px rgba(92,242,181,.9))}
  #stage[data-look="nl"] .town{stroke:#b9efe0}#stage[data-look="nl"] .town.done{fill:#5cf2b5;stroke:#5cf2b5}
  #stage[data-look="nl"] .tname{font-family:"Sora",sans-serif;stroke:rgba(5,15,29,.95)}
  #stage[data-look="nl"] .mapchip{background:rgba(6,20,36,.85);border-color:rgba(92,242,181,.4)}
  #stage[data-look="nl"] .world-land{fill:rgba(92,242,181,.2);stroke:rgba(92,242,181,.5)}
  /* tema "Blåtryk": tegnebord med gitter, hvide streger og skravering */
  #stage[data-look="bp"]{--ink:#0a3463;--panel2:transparent;--lilac:#ffffff;--pink:#ffffff;--red:#ffd23f;--cream:#ffffff;--muted:#a6c8ea;--line:rgba(255,255,255,.55);--glow:rgba(255,255,255,.12);font-family:"DM Sans",system-ui,sans-serif}
  #stage[data-look="bp"] .panel{background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/28px 28px,#0c3a6d;border:2px solid rgba(255,255,255,.7);border-radius:3px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);backdrop-filter:none}
  #stage[data-look="bp"] .pill,#stage[data-look="bp"] .eyebrow,#stage[data-look="bp"] .v2 .head b,#stage[data-look="bp"] .stats span{font-family:"JetBrains Mono",monospace}
  #stage[data-look="bp"] .pill{background:none;border:2px solid #fff;border-radius:3px;box-shadow:none;color:#fff}
  #stage[data-look="bp"] .bar{background:transparent;border:2px solid rgba(255,255,255,.75);border-radius:2px;box-shadow:none}
  #stage[data-look="bp"] .bar>i{background:repeating-linear-gradient(45deg,#fff 0 5px,transparent 5px 10px);box-shadow:none;border-radius:0}
  #stage[data-look="bp"] .v1 .trail i{border-radius:2px}
  #stage[data-look="bp"] .v1 .trail i.done{background:#fff;box-shadow:none}
  #stage[data-look="bp"] .v1 .trail i.cur::after{background:#fff}
  #stage[data-look="bp"] svg.map{border-radius:2px;background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/30px 30px,#0a3463}
  #stage[data-look="bp"] .land{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.85)}
  #stage[data-look="bp"] .land2{fill:transparent;stroke:rgba(255,255,255,.3)}
  #stage[data-look="bp"] .seg{stroke:rgba(255,255,255,.45)}
  #stage[data-look="bp"] .seg:not(.done):not(.train){stroke-dasharray:3 2.2}
  #stage[data-look="bp"] .seg.done{stroke:#fff;filter:none}
  #stage[data-look="bp"] .town{fill:#0a3463;stroke:#fff}#stage[data-look="bp"] .town.done{fill:#fff;stroke:#fff}
  #stage[data-look="bp"] .tname{fill:#fff;stroke:#0a3463}
  #stage[data-look="bp"] .me{fill:#ffd23f;stroke:#0c3a6d}#stage[data-look="bp"] .pulse{stroke:#ffd23f}
  #stage[data-look="bp"] .mapchip{background:#0c3a6d;border:2px solid #fff;border-radius:3px}
  #stage[data-look="bp"] .v4 li{border-radius:3px}
  #stage[data-look="bp"] .v4 li.cur{background:transparent;border:2px solid #fff;box-shadow:none}
  #stage[data-look="bp"] .v4 li.cur .n{background:#ffd23f;border-color:#ffd23f;color:#1a2a00}
  #stage[data-look="bp"] .v4 li.cur .prog i{background:#fff}
  #stage[data-look="bp"] .v5 .stats div,#stage[data-look="bp"] .v5 .etabox{border:1.5px solid rgba(255,255,255,.4);border-radius:3px}
  #stage[data-look="bp"] .world-land{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.7)}
  #stage[data-look="bp"] .world-dk{fill:#ffd23f;stroke:#0c3a6d}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { DEFAULT_TITLE, LOOKS } from "./fields.js";
import { STAGES, TOWNS, TOTAL_KM, dayForDate, progress, positionOnStage, pathUpTo } from "./route.js";
import { paceText, timeText, timerStatus, etaInfo } from "./pace.js";
import { DK_LAND, DK_NEIGHBORS, WORLD_LAND, WORLD_DK, WORLD_VIEW, dkXY, worldXY } from "./geo.js";

const q = new URLSearchParams(location.search);
const num = (v, d) => (v != null && v !== "" && Number.isFinite(Number(v)) ? Number(v) : d);
const fmt = (n, dec = 1) => new Intl.NumberFormat("da-DK", { maximumFractionDigits: dec, minimumFractionDigits: 0 }).format(n);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const stage$ = document.getElementById("stage");
function fit() { stage$.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }
addEventListener("resize", fit); fit();

const routeLabel = (s) => `${esc(s.from)}<span class="arrow">→</span>${esc(s.to)}`;
const viaLabel = (s) => [s.train, s.via ? "via " + s.via : ""].filter(Boolean).map(esc).join(" · ");
const pctW = (p) => `${Math.max(0, Math.min(1, p)) * 100}%`;

function headerNote(p) {
  if (p.state === "before") return "Starter 12/10";
  if (p.state === "done") return "Fremme!";
  return `Dag ${p.stage.day}/${STAGES.length}`;
}

// Etiketter på kortet: [dx, dy] i skærm-px fra byen (skaleres med kortets zoom).
const LABELS = { rosenholm: [16, -8], aarhus: [16, 24], skanderborg: [14, 24], silkeborg: [0, -16], ikast: [0, 30], herning: [-16, 6], brande: [-16, 6], jelling: [-16, 10], give: [16, 6], horsens: [16, -8], vejle: [16, 24], middelfart: [-16, 6], aarup: [-14, 26], odense: [0, -18], nyborg: [0, 30], korsoer: [-4, -16], slagelse: [10, -16], naestved: [14, -12], gavnoe: [-14, 24] };

const MAJOR = new Set(["rosenholm", "aarhus", "silkeborg", "herning", "vejle", "odense", "naestved", "gavnoe"]);

// Tegner Danmark (rigtig kystlinje) med ruten. W×H er visningsstørrelsen i px.
function dkMap(p, f, W, H, fontPx, allLabels = true) {
  const s = p.stage;
  const overview = f("overview"); // fra = zoom ind på dagens etape, så bevægelsen bliver tydelig
  const xy = (overview ? Object.values(TOWNS) : s.path.map((k) => TOWNS[k])).map((t) => dkXY(t.lon, t.lat));
  const minX = Math.min(...xy.map((a) => a[0])), maxX = Math.max(...xy.map((a) => a[0]));
  const minY = Math.min(...xy.map((a) => a[1])), maxY = Math.max(...xy.map((a) => a[1]));
  const padX = 118, padY = 66; // luft til bynavne (Herning til venstre, Gavnø til højre)
  const bw = Math.max(maxX - minX, overview ? 0 : 330), bh = Math.max(maxY - minY, overview ? 0 : 230); // en kort etape zoomes ikke ind i det uendelige
  const z = Math.min((W - 2 * padX) / bw, (H - 2 * padY) / bh); // px pr. kort-enhed
  const u = 1 / z; // kort-enheder pr. skærm-px
  const vw = W * u, vh = H * u, vx = (minX + maxX) / 2 - vw / 2, vy = (minY + maxY) / 2 - vh / 2;
  const P = (key) => dkXY(TOWNS[key].lon, TOWNS[key].lat);
  const pt = (key) => P(key).map((n) => n.toFixed(1)).join(",");
  let segs = "", dots = "", names = "";
  const seen = new Set();
  STAGES.forEach((st, i) => {
    const done = p.state === "done" || i < p.idx;
    segs += `<polyline class="seg${done ? " done" : ""}" stroke-width="${(6 * u).toFixed(2)}" points="${st.path.map(pt).join(" ")}"/>`;
    if (st.train) segs += `<polyline class="seg train" stroke-width="${(6 * u).toFixed(2)}" points="${pt("nyborg")} ${pt("korsoer")}"/>`;
    st.path.forEach((k, j) => {
      if (seen.has(k)) return; seen.add(k);
      const reached = done || (i === p.idx && j === 0 && p.state === "walking");
      const [x, y] = P(k);
      dots += `<circle class="town${reached ? " done" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(7 * u).toFixed(2)}" stroke-width="${(3 * u).toFixed(2)}"/>`;
      const lab = LABELS[k];
      if (lab && f("labels") && (allLabels || MAJOR.has(k)) && (overview || (x > vx - 20 * u && x < vx + vw + 20 * u && y > vy && y < vy + vh))) names += `<text class="tname" x="${(x + lab[0] * u).toFixed(1)}" y="${(y + lab[1] * u).toFixed(1)}" font-size="${(fontPx * u).toFixed(2)}" stroke-width="${(5 * u).toFixed(2)}" text-anchor="${lab[0] < -2 ? "end" : lab[0] > 2 ? "start" : "middle"}">${esc(TOWNS[k].name)}</text>`;
    });
  });
  const pos = p.state === "done" ? TOWNS.gavnoe : positionOnStage(s, p.stagePct);
  // Dagens etape: det stykke, der er gået, tegnes lyst og vokser med km (opdateres glidende af mapTick).
  const trailPts = p.state === "done" ? [] : pathUpTo(s, p.stagePct).map((t) => dkXY(t.lon, t.lat).map((n) => n.toFixed(1)).join(","));
  const trail = `<polyline class="seg done cur" stroke-width="${(6 * u).toFixed(2)}" points="${trailPts.join(" ")}"${trailPts.length < 2 || p.stagePct < 0.002 ? ' visibility="hidden"' : ""}/>`;
  const [mx, my] = dkXY(pos.lon, pos.lat);
  const me = `<circle class="pulse" cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${(12 * u).toFixed(2)}" stroke-width="${(3 * u).toFixed(2)}"/><circle class="me" cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${(10 * u).toFixed(2)}" stroke-width="${(4 * u).toFixed(2)}"/>`;
  const sw = (1.6 * u).toFixed(2);
  return `<svg class="map dk" viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" style="aspect-ratio:${W}/${H}" preserveAspectRatio="xMidYMid slice">
    <path class="land2" stroke-width="${sw}" d="${DK_NEIGHBORS}"/><path class="land" stroke-width="${sw}" d="${DK_LAND}"/>${segs}${trail}${dots}${names}${me}</svg>`;
}

function worldMap(f) {
  const [x, y] = worldXY(10.2, 56.0);
  let grat = "";
  for (let lon = -150; lon <= 180; lon += 30) { const [gx] = worldXY(lon, 0); grat += `M${gx} 0V${WORLD_VIEW.h}`; }
  for (let lat = -30; lat <= 60; lat += 30) { const [, gy] = worldXY(0, lat); grat += `M0 ${gy}H${WORLD_VIEW.w}`; }
  return `<div class="worldbox"><svg class="map" viewBox="0 0 ${WORLD_VIEW.w} ${WORLD_VIEW.h}" style="border-radius:0">
    <path class="grat" d="${grat}"/><path class="world-land" d="${WORLD_LAND}"/><path class="world-dk" d="${WORLD_DK}"/>
    <circle class="pulse" cx="${x}" cy="${y}" r="26" stroke-width="4"/><circle cx="${x}" cy="${y}" r="44" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 7" opacity=".9"/><circle class="me" cx="${x}" cy="${y}" r="11" stroke-width="3"/></svg>
    <span class="cap">Danmark</span></div>`;
}

// De tre stats (I dag / I alt / Tilbage) — bruges af v2 og v3.
function statCells(p, f, t, withPace = false) {
  const cells = [];
  if (f("todayKm")) cells.push(`<div><span>I dag</span><b class="mono">${fmt(p.todayKm)}/${p.stage.km} km</b></div>`);
  if (f("total")) cells.push(`<div><span>I alt</span><b class="mono">${fmt(p.doneKm)} km</b></div>`);
  if (f("left")) cells.push(`<div><span>Tilbage</span><b class="mono">${fmt(p.kmLeft)} km</b></div>`);
  if (withPace && f("pace")) cells.push(`<div><span>Ø-tempo</span><b class="mono">${t.pace}</b></div>`);
  return cells;
}

// "Forventet fremme kl. 16:40" — tom når tiden endnu er ukendt.
const etaLabel = (t, short = false) => (t.eta === "–" ? "" : t.eta === "Fremme" ? "Snart fremme" : `${short ? "fremme" : "Forventet fremme"} kl. ${t.eta}`);

function sumLine(p, f, t) {
  const parts = [];
  if (f("date")) parts.push(`${headerNote(p)} · ${esc(p.stage.date)}`);
  if (f("pace")) parts.push(`Ø ${t.pace}`);
  if (f("eta") && t.eta !== "–") parts.push(t.eta === "Fremme" ? "snart fremme" : `mål ${t.eta}`);
  return parts.length ? `<div class="sum">${parts.map((x) => `<span>${x}</span>`).join("")}</div>` : "";
}

// Flytter dagens lyse spor og prikken glidende mellem de (0,1 km) gange, hvor hele overlayet tegnes forfra.
function mapTick(pr, kmS) {
  const trail = stage$.querySelector("svg.dk .seg.cur");
  if (!trail || pr.state === "done") return;
  const frac = Math.min(1, Math.max(0, kmS / pr.stage.km));
  const pts = pathUpTo(pr.stage, frac).map((t) => dkXY(t.lon, t.lat));
  trail.setAttribute("points", pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
  trail.setAttribute("visibility", frac < 0.002 ? "hidden" : "visible");
  const [x, y] = pts[pts.length - 1];
  stage$.querySelectorAll("svg.dk .me, svg.dk .pulse").forEach((c) => { c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); });
}

const views = {
  1(p, f, title, t) {
    const s = p.stage;
    const trail = STAGES.map((st, i) => {
      const cls = p.state === "done" || i < p.idx ? "done" : i === p.idx && p.state === "walking" ? "cur" : "";
      return `<i class="${cls}" style="--p:${pctW(p.stagePct)}"></i>`;
    }).join("");
    const parts = [];
    if (f("via") && viaLabel(s)) parts.push(viaLabel(s));
    if (f("todayKm")) parts.push(`<span class="mono">${fmt(p.todayKm)} / ${s.km} km</span> i dag`);
    if (f("pace")) parts.push(`Ø-tempo <span class="mono">${t.pace}</span>`);
    if (f("time")) parts.push(`gå-tid <span class="mono">${t.time}</span>`);
    if (f("eta") && etaLabel(t)) parts.push(`<b class="eta">${etaLabel(t)}</b>`);
    if (f("stay")) parts.push(`overnatning: ${esc(s.stay)}`);
    const tot = f("total") || f("left")
      ? `<div class="tot">${f("total") ? `<b class="mono">${fmt(p.doneKm)}</b> <span>/ ${TOTAL_KM} km</span>` : ""}${f("left") ? `<div class="sub">${fmt(p.kmLeft)} km til Gavnø</div>` : ""}</div>` : "";
    return `<div class="v1 panel"><div class="row">
      ${f("badge") ? `<div class="day">${f("badge") ? `<span class="pill">${headerNote(p)}</span>` : ""}</div>` : ""}
      <div class="mid"><div class="route">${routeLabel(s)}</div>
        ${parts.length ? `<div class="sub">${parts.join(" · ")}</div>` : ""}
        ${f("todayBar") ? `<div class="bar"><i style="width:${pctW(p.stagePct)}"></i></div>` : ""}</div>
      ${tot}
    </div>${f("trail") ? `<div class="trail">${trail}</div>` : ""}</div>`;
  },
  2(p, f, title, t) {
    const s = p.stage;
    const head = f("title") || f("badge")
      ? `<div class="head"><b>${f("title") ? esc(title) : ""}</b><span class="pills">${f("badge") ? `<span class="pill">${headerNote(p)}</span>` : ""}</span></div>` : "";
    const cells = statCells(p, f, t);
    const paceLine = [f("pace") ? `Ø-tempo <b class="mono">${t.pace}</b>` : "", f("time") ? `gå-tid <b class="mono">${t.time}</b>` : ""].filter(Boolean).join(" · ");
    return `<div class="v2 panel">${head}
      <div class="body"><div class="route">${routeLabel(s)}</div>${f("via") && viaLabel(s) ? `<div class="via">${viaLabel(s)}</div>` : ""}
      ${f("todayBar") ? `<div class="bar"><i style="width:${pctW(p.stagePct)}"></i></div>` : ""}
      ${paceLine ? `<div class="pace">${paceLine}</div>` : ""}
      ${f("eta") && etaLabel(t) ? `<div class="pace eta-line">${etaLabel(t)}</div>` : ""}
      ${f("stay") ? `<div class="stay">Overnatning: ${esc(s.stay)}</div>` : ""}</div>
      ${cells.length ? `<div class="stats" style="grid-template-columns:repeat(${cells.length},1fr)">${cells.join("")}</div>` : ""}</div>`;
  },
  3(p, f, title, t) {
    const s = p.stage;
    const cells = statCells(p, f, t, true);
    return `<div class="v3 panel"><div class="top"><div class="route">${routeLabel(s)}</div><span class="pills">${f("badge") ? `<span class="pill">${headerNote(p)}</span>` : ""}</span></div>
      <div class="mapbox">${dkMap(p, f, 732, 400, 20, false)}${f("eta") && etaLabel(t) ? `<div class="mapchip">${etaLabel(t)}</div>` : ""}</div>
      ${cells.length ? `<div class="stats${cells.length > 3 ? " four" : ""}" style="grid-template-columns:repeat(${cells.length},1fr)">${cells.join("")}</div>` : ""}</div>`;
  },
  4(p, f, title, t) {
    const rows = STAGES.map((st, i) => {
      const done = p.state === "done" || i < p.idx, cur = p.state === "walking" && i === p.idx;
      return `<li class="${done ? "done" : cur ? "cur" : ""}"><span class="n">${done ? "✓" : st.day}</span><span>${esc(st.from)}<span class="arrow">→</span>${esc(st.to)}</span>${f("kms") ? `<span class="km mono">${st.km} km</span>` : "<span></span>"}${cur ? `<div class="prog"><i style="width:${pctW(p.stagePct)}"></i></div>` : ""}</li>`;
    }).join("");
    return `<div class="v4 panel">${f("title") ? `<h1>${esc(title)}</h1>` : ""}${sumLine(p, f, t)}<ol>${rows}</ol>
      ${f("total") ? `<div class="total"><div><span class="mono"><b>${fmt(p.doneKm)}</b> / ${TOTAL_KM} km</span><span class="muted">${fmt(p.pct * 100, 0)} %</span></div><div class="bar"><i style="width:${pctW(p.pct)}"></i></div></div>` : ""}</div>`;
  },
  5(p, f, title, t) {
    const s = p.stage;
    const stats = [];
    if (f("total")) stats.push(`<div><span>I alt</span><b class="mono">${fmt(p.doneKm)} km</b></div>`);
    if (f("left")) stats.push(`<div><span>Tilbage</span><b class="mono">${fmt(p.kmLeft)} km</b></div>`);
    if (f("pace")) stats.push(`<div><span>Ø-tempo</span><b class="mono">${t.pace}</b></div>`);
    if (f("time")) stats.push(`<div><span>Gå-tid</span><b class="mono">${t.time}</b></div>`);
    return `<div class="v5 panel">
      <div class="dkmap">${dkMap(p, f, 880, 640, 22)}</div>
      <aside>
        ${f("world") ? worldMap(f) : ""}
        <div class="info">
          <div class="ttl">${f("title") ? `<span class="eyebrow">${esc(title)}</span>` : "<span></span>"}<span class="pills">${f("badge") ? `<span class="pill">${headerNote(p)}</span>` : ""}</span></div>
          <div class="route">${routeLabel(s)}</div>
          ${f("via") && viaLabel(s) ? `<div class="sub">${viaLabel(s)}</div>` : ""}
          ${f("todayKm") ? `<div class="kmrow"><span>I dag</span><span><b class="mono">${fmt(p.todayKm)}</b> / ${s.km} km</span></div><div class="bar"><i style="width:${pctW(p.stagePct)}"></i></div>` : ""}
          ${stats.length ? `<div class="stats">${stats.join("")}</div>` : ""}
          ${f("next") && p.state === "walking" && STAGES[p.idx + 1] ? `<div class="sub next">I morgen: <b>${esc(STAGES[p.idx + 1].from)}<span class="arrow">→</span>${esc(STAGES[p.idx + 1].to)}</b> · ${STAGES[p.idx + 1].km} km</div>` : ""}
          ${f("eta") && etaLabel(t) ? `<div class="etabox"><span>Forventet mål</span><b class="mono">${t.eta === "Fremme" ? "Snart" : t.eta}</b></div>` : ""}
          ${f("stay") ? `<div class="sub">Overnatning: ${esc(s.stay)}</div>` : ""}
        </div></aside></div>`;
  }
};

// Hvor på skærmen hver overlay er forankret — størrelsen skaleres ind mod det hjørne.
const ORIGIN = { 1: "center bottom", 2: "left top", 3: "right bottom", 4: "left top", 5: "right bottom" };
const VARIANTS = ["1", "2", "3", "4", "5"];

// Værdier fra URL'en (?v, ?day, ?km, ?scale) vinder over kontrolpanelet — bruges af galleriet til demo.
const demo = q.has("day") || q.has("km") || q.has("preview");
let live = { day: null, km: 0, variant: "1", visible: true, fields: {}, title: "", scale: 1, paceUnit: "kmh", look: "nu", brightness: 1, eta: null, kmRate: 0, kmCap: 100, timer: { running: false, ms: 0 } };
let fetchedAt = Date.now();
let lastKey = "";

function render() {
  const v = VARIANTS.includes(q.get("v")) ? q.get("v") : live.variant;
  if (!live.visible && !demo) { if (lastKey !== "hidden") { stage$.innerHTML = ""; lastKey = "hidden"; } return; }
  const day = num(q.get("day"), live.day ?? dayForDate());
  // Km tæller selv op mellem hentningerne, mens uret kører (serveren giver km, tempo og loft). ?km= i URL'en vinder (demo).
  const liveKm = Math.min((live.km || 0) + ((live.kmRate || 0) * (Date.now() - fetchedAt)) / 3600000, live.kmCap ?? 100);
  const km = Math.round(num(q.get("km"), liveKm) * 10) / 10;
  const scale = Math.min(1.5, Math.max(0.3, num(q.get("scale"), live.scale ?? 1)));
  const fields = live.fields?.[v] || {};
  const f = (k) => fields[k] !== false;
  const title = live.title || DEFAULT_TITLE;
  // Gå-tid: serverens værdi + tiden siden vi hentede den, hvis uret løber. ?min= (+ ?paused=1) bruges til demo.
  const demoTimer = q.has("min") ? { running: q.get("paused") !== "1", ms: num(q.get("min"), 0) * 60000 } : null;
  const tm = demoTimer || live.timer || { running: false, ms: 0 };
  const ms = tm.ms + (tm.running && !demoTimer ? Date.now() - fetchedAt : 0);
  const status = timerStatus({ running: tm.running, ms });
  const unit = live.paceUnit || "kmh";
  const kmS = q.has("km") ? km : liveKm; // uafrundet km: tempo, ankomst og kortets spor regnes ud fra den (ellers svinger tallene mellem 0,1-trinene)
  const pace = paceText(kmS, ms, unit);
  const time = timeText(ms);
  const pr = progress(day, km);
  const pk = progress(day, kmS);
  const etaI = etaInfo({ remainingKm: pk.stage.km - pk.todayKm, ms, kmToday: pk.todayKm, manual: live.eta, nowMs: Date.now(), walking: pr.state !== "done" });
  const t = { pace, time, status, eta: etaI.text };
  const look = LOOKS.some(([k]) => k === q.get("look")) ? q.get("look") : live.look || "nu"; // ?look= og ?bri= i URL'en vinder over panelet (demo)
  const bri = Math.min(1, Math.max(0.3, num(q.get("bri"), live.brightness ?? 1)));
  const key = JSON.stringify([v, day, km, fields, title, scale, pace, time, status, unit, etaI.text, look, bri]);
  if (key === lastKey) { mapTick(pr, kmS); return; } // undgå at genstarte animationer uden ændringer
  lastKey = key;
  stage$.dataset.look = look;
  stage$.style.setProperty("--bri", bri);
  stage$.innerHTML = views[v](pr, f, title, t);
  mapTick(pr, kmS);
  const root = stage$.firstElementChild;
  if (root && scale !== 1) { root.style.transformOrigin = ORIGIN[v]; root.style.transform = `scale(${scale})`; }
  if (root && status === "paused" && f("pause")) {
    // Mærket sidder midt på overlayets overkant (målt efter skalering), så det ikke dækker tal eller kort.
    root.classList.add("is-paused");
    const sr = stage$.getBoundingClientRect(), r = root.getBoundingClientRect(), z = sr.width / 1920;
    const left = (r.left - sr.left + r.width / 2) / z, top = Math.max(30 * scale, (r.top - sr.top) / z);
    stage$.insertAdjacentHTML("beforeend", `<div class="pausetab" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px;--sc:${scale}"><i class="pbars"></i>PAUSE</div>`);
  }
}

async function poll() {
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    if (r.ok) { live = await r.json(); fetchedAt = Date.now(); }
  } catch {}
  render();
}
poll();
setInterval(poll, q.has("preview") ? 1000 : 2000);
setInterval(render, 1000); // km, gå-tid og tempo tikker mellem hentningerne
</script>
</body>
</html>
