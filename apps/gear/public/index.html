<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Gear — Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --display: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ink: #ededed;
    --muted: #b8b8c1; /* the small texts: light enough to read on a bright stream */
    --line: #2b2b31;
    /* The colour of the stripe, the brand, the price and the chat command: orange unless the panel picks another. */
    --now: #ff8a3d;
    --now-soft: rgba(255, 138, 61, .16);
  }
  * { box-sizing: border-box; }
  /* The page fills whatever size the browser source has and the card sits at the bottom of it (?align=left or right
     moves it to a corner). Everything inside the card is sized in em, so the size slider scales the whole card. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color: var(--ink); }

  .stage { position: absolute; inset: auto 0 0 0; display: flex; justify-content: center; padding: 40px; }
  .stage.left { justify-content: flex-start; }
  .stage.right { justify-content: flex-end; }

  .card {
    position: relative; display: flex; align-items: stretch; width: 40em; max-width: 100%; min-height: 11em; font-size: 16px;
    background: rgba(11, 11, 13, .96); border: 1px solid var(--line); border-left: 3px solid var(--now); border-radius: 4px; overflow: hidden;
    opacity: 0; transform: translateY(2.5em); transition: opacity .5s ease, transform .6s cubic-bezier(.2, .7, .2, 1);
  }
  .card.on { opacity: 1; transform: none; }
  .card[data-accent="lime"] { --now: #c9f36b; --now-soft: rgba(201, 243, 107, .14); }
  .card[data-accent="mint"] { --now: #72c99b; --now-soft: rgba(114, 201, 155, .18); }
  .card[data-accent="blue"] { --now: #5cc8ff; --now-soft: rgba(92, 200, 255, .17); }
  .card[data-accent="violet"] { --now: #a78bfa; --now-soft: rgba(167, 139, 250, .2); }
  .card[data-accent="yellow"] { --now: #ffd23f; --now-soft: rgba(255, 210, 63, .15); }
  .card[data-accent="pink"] { --now: #ff6b9a; --now-soft: rgba(255, 107, 154, .18); }
  .card[data-accent="white"] { --now: #ededed; --now-soft: rgba(255, 255, 255, .1); }

  .portrait { flex: 0 0 9em; align-self: stretch; overflow: hidden; }
  .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0;
    -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent); mask-image: linear-gradient(90deg, #000 72%, transparent); }
  .picture { flex: 0 0 9em; display: grid; place-items: center; padding: 1em 0 1em 1.25em; }
  .picture img { display: block; max-width: 100%; max-height: 8em; object-fit: contain; filter: drop-shadow(0 .4em .6em rgba(0, 0, 0, .45)); }
  .portrait[hidden], .picture[hidden], .copy[hidden], .outro[hidden] { display: none; }

  .copy { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 1.25em 1.5em 1.125em; }
  .eyebrow { display: flex; gap: .75em; padding-right: 7em; font: 500 .75em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .eyebrow b { font-weight: 500; color: var(--now); overflow: hidden; text-overflow: ellipsis; }
  .name { margin: .3em 0 .35em; font: 400 1.875em/1.05 var(--display); letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .details { display: flex; align-items: baseline; flex-wrap: wrap; gap: .25em .75em; }
  .price { font: 400 1.5em/1 var(--display); color: var(--now); }
  .before { font: 500 .75em/1 var(--mono); color: var(--muted); text-decoration: line-through; }
  .command { margin-left: auto; padding: .4em .7em; font: 500 .875em/1 var(--mono); color: var(--now); background: var(--now-soft); border: 1px solid var(--now); border-radius: 3px; }
  .price:empty, .before:empty, .command:empty, .hint:empty, .shop:empty, .eyebrow b:empty { display: none; }
  .hint { margin-top: .9em; padding-top: .75em; border-top: 1px solid var(--line); font: 500 .6875em/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .outro { flex: 1 1 0; min-width: 0; display: flex; align-items: center; padding: 1.5em 1.75em; font: 400 2em/1.1 var(--display); letter-spacing: -.01em; }
  .shop { position: absolute; top: 1.2em; right: 1.5em; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 500 .75em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .card { transform: none; transition: opacity .25s ease; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <article class="card" id="card" aria-hidden="true">
    <div class="portrait" id="portrait" hidden><img id="portrait-img" alt=""></div>
    <div class="picture" id="picture" hidden><img id="picture-img" alt=""></div>
    <div class="copy" id="copy">
      <div class="eyebrow"><span id="eyebrow"></span><b id="brand"></b></div>
      <div class="name" id="name"></div>
      <div class="details"><span class="price" id="price"></span><span class="before" id="before"></span><span class="command" id="command"></span></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="outro" id="outro" hidden></div>
    <div class="shop" id="shop"></div>
  </article>
</div>

<script>
(function () {
  var API = '/gear/api';
  var FADE = 650, BETWEEN = 450;
  var $ = function (id) { return document.getElementById(id); };
  var card = $('card');
  var params = new URLSearchParams(location.search);
  var profile = params.get('profile');
  var state = null;
  var running = false;
  var lastStart = 0; // when the last round began; the next one is due "every minutes" after that
  var firstAt = Date.now() + 2500; // the first round comes shortly after the page is opened
  var playNow = false;

  var align = params.get('align');
  if (align === 'left' || align === 'right') $('stage').classList.add(align);
  // The size is set with the slider in the panel (plan.scale); ?scale= in the address is an extra factor on top of it.
  var urlScale = parseFloat(params.get('scale'));
  if (!(urlScale >= 0.5 && urlScale <= 3)) urlScale = 1;

  var wait = function (ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); };

  // A picture has its own address; a channel's picture needs the channel in it.
  function imageUrl(id, version) {
    return API + '/image/' + encodeURIComponent(id) + '?v=' + encodeURIComponent(version) + (profile ? '&profile=' + encodeURIComponent(profile) : '');
  }
  // Waits for a picture to be ready, so the card never slides in with an empty hole in it.
  function load(img, src) {
    return new Promise(function (resolve) {
      if (!src) { img.removeAttribute('src'); return resolve(false); }
      img.onload = function () { resolve(true); };
      img.onerror = function () { resolve(false); };
      img.src = src;
      setTimeout(function () { resolve(img.complete && img.naturalWidth > 0); }, 4000);
    });
  }

  function applyPlan() {
    var plan = state.plan;
    card.dataset.accent = plan.accent || 'orange';
    card.style.fontSize = 16 * (Number(plan.scale) || 1) * urlScale + 'px';
    $('shop').textContent = plan.shop || '';
    $('eyebrow').textContent = plan.eyebrow || '';
    $('hint').textContent = plan.hint || '';
  }

  function show(ms) {
    card.classList.add('on');
    card.setAttribute('aria-hidden', 'false');
    return wait(FADE + ms).then(function () {
      card.classList.remove('on');
      card.setAttribute('aria-hidden', 'true');
      return wait(FADE + BETWEEN);
    });
  }

  function showProduct(product, ms) {
    return load($('picture-img'), product.image ? imageUrl(product.id, product.image) : '').then(function (hasPicture) {
      $('picture').hidden = !hasPicture;
      $('copy').hidden = false;
      $('outro').hidden = true;
      $('brand').textContent = product.brand || '';
      $('name').textContent = product.name;
      $('price').textContent = product.price || '';
      $('before').textContent = product.before || '';
      $('command').textContent = product.command || '';
      return show(ms);
    });
  }

  function showOutro(text, ms) {
    $('picture').hidden = true;
    $('copy').hidden = true;
    $('outro').hidden = false;
    $('outro').textContent = text;
    return show(ms);
  }

  // One round: every product in turn, then the closing line when it is switched on.
  function round() {
    var plan = state.plan, products = state.products.slice();
    var ms = (Number(plan.showSeconds) || 7) * 1000;
    return load($('portrait-img'), plan.portrait ? imageUrl('portrait', plan.portrait) : '').then(function (hasPortrait) {
      $('portrait').hidden = !hasPortrait;
      return products.reduce(function (before, product) {
        return before.then(function () { return showProduct(product, ms); });
      }, Promise.resolve());
    }).then(function () {
      if (plan.outroEnabled && plan.outroText) return showOutro(plan.outroText, ms);
    });
  }

  setInterval(function () {
    if (running || !state || !state.products.length) return;
    var every = (Number(state.plan.everyMinutes) || 15) * 60000;
    var due = lastStart ? lastStart + every : firstAt;
    if (!playNow && Date.now() < due) return;
    playNow = false;
    running = true;
    lastStart = Date.now();
    round().catch(function () {}).then(function () { running = false; });
  }, 500);

  function render(next) {
    state = next;
    applyPlan();
  }

  fetch(API + '/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
  var events = new EventSource(API + '/events');
  events.onmessage = function (event) { try { render(JSON.parse(event.data)); } catch (e) {} };
  // "Vis nu" in the panel.
  events.addEventListener('play', function () { playNow = true; });
})();
</script>

</body>
</html>
