<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1210">
  <title>Minecraft Boss Tracker</title>
  <style>
    :root { color-scheme: dark; --bg:#08100d; --panel:#101b16; --line:#6f8f3e; --lime:#a2d344; --text:#f2f2ed; --muted:#aeb8af; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 0,#182b20 0,#08100d 46%,#050907 100%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    main { width:min(780px,100%); padding:clamp(26px,6vw,60px); background:rgba(12,22,17,.92); border:1px solid rgba(111,143,62,.5); clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px); box-shadow:0 24px 80px rgba(0,0,0,.45); }
    .eyebrow { margin:0 0 12px; color:var(--lime); font-size:12px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,7vw,64px); line-height:.95; letter-spacing:-.045em; }
    .lead { max-width:600px; margin:22px 0 32px; color:var(--muted); font-size:17px; line-height:1.65; }
    nav { display:flex; flex-wrap:wrap; gap:12px; }
    a { display:inline-flex; align-items:center; min-height:46px; padding:0 18px; border:1px solid var(--line); color:var(--text); text-decoration:none; font-weight:850; letter-spacing:.02em; background:rgba(111,143,62,.08); }
    a.primary { color:#0a100b; background:var(--lime); border-color:var(--lime); }
    .hint { margin:28px 0 0; color:#7e8b81; font-size:13px; }
    code { color:#d8e9b5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Streaming overlay</p>
    <h1>Minecraft<br>Boss Tracker</h1>
    <p class="lead">Følg Warden, Elder Guardian, Wither og Ender Dragon live. Dødsfald og boss-status synkroniseres med OBS med det samme.</p>
    <nav aria-label="Tracker-sider">
      <a class="primary" href="/minecraft/control">Åbn kontrolpanel</a>
      <a href="/minecraft/overlay">Åbn overlay</a>
    </nav>
    <p class="hint">OBS Browser Source: brug <code>/overlay</code> med mindst 620 × 190 px.</p>
  </main>
</body>
</html>
