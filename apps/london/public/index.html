<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>London-plan — Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --display: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --bg: #0b0b0d;
    --ink: #ededed;
    --muted: #9b9ba4;
    --line: #2b2b31;
    --lime: #c9f36b;
    --green: #72c99b;
    --soft: #192923;
    --power: #ff4c02; /* the orange of the Power logo */
  }
  * { box-sizing: border-box; }
  /* The page fills whatever size the browser source has and the card sits in one corner of it (?corner=, default bottom-right).
     Everything inside the card is sized in em from the card's font size, so ?scale= makes the whole card bigger or smaller. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color: var(--ink); }

  .card {
    --gap: 1.25em;
    position: absolute; top: var(--gap); right: var(--gap); width: 23.75em; font-size: 16px;
    padding: 1em 1em .375em; background: rgba(11, 11, 13, .9); border: 1px solid var(--line); border-radius: 4px;
    opacity: 0; transition: opacity .4s ease;
  }
  .card.bottom { top: auto; bottom: var(--gap); }
  .card.left { right: auto; left: var(--gap); }
  .card.on { opacity: 1; }

  .head { display: flex; justify-content: space-between; align-items: baseline; font: 500 .75em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .title { margin: .25em 0 .35em; font: 400 2.125em/.95 var(--display); letter-spacing: -.02em; }
  .title em { font-style: italic; color: var(--power); }

  .list { margin: 0; padding: 0; list-style: none; }
  .row {
    display: grid; grid-template-columns: 1.625em 1fr auto; align-items: center; gap: .625em;
    padding: .5625em .5em; border-top: 1px solid var(--line); border-left: 3px solid transparent;
    transition: background .4s ease, border-color .4s ease, opacity .4s ease;
  }
  .row.enter { opacity: 0; }
  .num { font: 500 .75em/1 var(--mono); letter-spacing: .04em; color: var(--muted); transition: color .4s ease; }
  .name { display: block; font: 400 1.5em/1.05 var(--display); letter-spacing: -.005em; transition: color .4s ease; }
  .note { display: block; margin-top: .4em; font: 500 .6875em/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .note:empty { display: none; }
  .tag { font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: .45em .6em; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
  .tag:empty { display: none; }

  .row.now { background: var(--soft); border-left-color: var(--lime); }
  .row.now .num { color: var(--lime); }
  .row.now .tag { background: var(--lime); border-color: var(--lime); color: var(--bg); }
  .row.done .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row.done .num { color: var(--green); }

  /* Compact view: only what is happening now, and the next stop. */
  .focus { display: none; }
  .card.compact .list { display: none; }
  .card.compact .focus { display: block; }
  .slot { padding: .75em .625em .8125em .6875em; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  .slot.now { background: var(--soft); border-left-color: var(--lime); }
  .slot.end { border-left-color: var(--green); }
  .slot .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .375em; }
  .slot .label { font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .slot.now .label { color: var(--lime); }
  .slot.end .label { color: var(--green); }
  .slot .big { display: block; font: 400 2em/1.02 var(--display); letter-spacing: -.01em; }
  .slot.next .big, .slot.end .big { font-size: 1.5em; }
  .swap { animation: swap .5s ease; }
  @keyframes swap { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head"><span id="kicker"></span><span id="count"></span></div>
  <h1 class="title" id="title"></h1>
  <ol class="list" id="list"></ol>
  <div class="focus">
    <div class="slot now" id="slot-now" hidden>
      <div class="label-row"><span class="label">Lige nu</span></div>
      <span class="big" id="now-name"></span>
      <span class="note" id="now-note"></span>
    </div>
    <div class="slot next" id="slot-next" hidden>
      <div class="label-row"><span class="label" id="next-label"></span><span class="tag" id="next-tag"></span></div>
      <span class="big" id="next-name"></span>
      <span class="note" id="next-note"></span>
    </div>
    <div class="slot end" id="slot-end" hidden>
      <div class="label-row"><span class="label">Planen er færdig</span></div>
      <span class="big">Alt er klaret</span>
    </div>
  </div>
</div>

<script>
(function () {
  var MAX_ROWS = 9; // longer than that and the card would run off the canvas: finished things drop off first
  var card = document.getElementById('card');
  var kickerEl = document.getElementById('kicker');
  var countEl = document.getElementById('count');
  var titleEl = document.getElementById('title');
  var list = document.getElementById('list');
  var rows = {};
  var $ = function (id) { return document.getElementById(id); };

  // Where the card sits and how big it is, set in the OBS address: ?corner=bottom-right (the default), top-right, top-left
  // or bottom-left, and ?scale=0.5 to 3 for a smaller or bigger card.
  var params = new URLSearchParams(location.search);
  var corner = String(params.get('corner') || 'bottom-right').split('-');
  card.classList.toggle('bottom', corner[0] === 'bottom');
  card.classList.toggle('left', corner[1] === 'left');
  var scale = parseFloat(params.get('scale'));
  if (scale >= 0.5 && scale <= 3) card.style.fontSize = 16 * scale + 'px';

  // Text that fades in when it changes, so the compact view does not just snap from one stop to the next.
  function swapText(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    el.classList.remove('swap');
    void el.offsetWidth;
    el.classList.add('swap');
  }

  // Compact view. The next stop is the same pick as "Færdig · start næste" in the panel (advance() in state.js):
  // the next open thing after what is running now, otherwise the first open one.
  function renderFocus(all, done) {
    var nowAt = all.findIndex(function (item) { return item.status === 'now'; });
    var nextAt = all.findIndex(function (item, i) { return i > nowAt && item.status === 'todo'; });
    if (nextAt === -1) nextAt = all.findIndex(function (item) { return item.status === 'todo'; });
    var now = all[nowAt], next = all[nextAt];
    $('slot-now').hidden = !now;
    if (now) { swapText($('now-name'), now.title); swapText($('now-note'), now.note || ''); }
    $('slot-next').hidden = !next;
    if (next) {
      swapText($('next-label'), nowAt === -1 && done === 0 ? 'Første stop' : 'Næste stop');
      swapText($('next-name'), next.title);
      swapText($('next-note'), next.note || '');
      $('next-tag').textContent = next.maybe ? 'Måske' : '';
    }
    $('slot-end').hidden = Boolean(now || next);
  }

  // One italic orange word in the headline: the "&" between two names, otherwise the last word.
  function setTitle(text) {
    titleEl.textContent = '';
    var head = '', accent = text, tail = '';
    var amp = text.indexOf(' & ');
    if (amp !== -1) { head = text.slice(0, amp + 1); accent = '&'; tail = text.slice(amp + 2); }
    else if (text.lastIndexOf(' ') !== -1) { head = text.slice(0, text.lastIndexOf(' ') + 1); accent = text.slice(text.lastIndexOf(' ') + 1); }
    if (head) titleEl.appendChild(document.createTextNode(head));
    var em = document.createElement('em');
    em.textContent = accent;
    titleEl.appendChild(em);
    if (tail) titleEl.appendChild(document.createTextNode(tail));
  }

  function makeRow() {
    var li = document.createElement('li');
    li.className = 'row enter';
    li.innerHTML = '<span class="num"></span><div><span class="name"></span><span class="note"></span></div><span class="tag"></span>';
    return li;
  }

  function render(state) {
    var plan = state.plan || {};
    var all = (state.items || []).filter(function (item) { return item.visible; });
    var done = all.filter(function (item) { return item.status === 'done'; }).length;

    var shown = all.slice();
    while (shown.length > MAX_ROWS) {
      var oldest = shown.findIndex(function (item) { return item.status === 'done'; });
      if (oldest === -1) { shown = shown.slice(0, MAX_ROWS); break; }
      shown.splice(oldest, 1);
    }

    kickerEl.textContent = plan.kicker || '';
    countEl.textContent = all.length ? done + ' / ' + all.length : '';
    setTitle(plan.title || '');

    var seen = {};
    shown.forEach(function (item, i) {
      var li = rows[item.id];
      if (!li) {
        li = rows[item.id] = makeRow();
        list.appendChild(li);
        requestAnimationFrame(function () { requestAnimationFrame(function () { li.classList.remove('enter'); }); });
      }
      ['todo', 'now', 'done'].forEach(function (status) { li.classList.toggle(status, item.status === status); });
      var number = String(all.indexOf(item) + 1);
      li.querySelector('.num').textContent = item.status === 'done' ? '✓' : (number.length < 2 ? '0' : '') + number;
      li.querySelector('.name').textContent = item.title;
      li.querySelector('.note').textContent = item.note || '';
      li.querySelector('.tag').textContent = item.status === 'now' ? 'Nu' : item.status === 'done' ? 'Færdig' : item.maybe ? 'Måske' : '';
      // Only move a row when it is in the wrong place, so a row that just changed state keeps its transition.
      if (list.children[i] !== li) list.insertBefore(li, list.children[i] || null);
      seen[item.id] = true;
    });
    Object.keys(rows).forEach(function (id) {
      if (!seen[id]) { rows[id].remove(); delete rows[id]; }
    });

    card.classList.toggle('compact', plan.view === 'compact');
    renderFocus(all, done);
    card.classList.toggle('on', shown.length > 0);
  }

  fetch('/london/api/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
  var events = new EventSource('/london/api/events');
  events.onmessage = function (event) {
    try { render(JSON.parse(event.data)); } catch (e) {}
  };
})();
</script>

</body>
</html>
