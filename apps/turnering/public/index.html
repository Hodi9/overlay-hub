<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Turnering — Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --display: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ink: #ededed;
    --muted: #b8b8c1; /* the small texts: light enough to read on a bright stream */
    --line: #2b2b31;
    --wire: #45454e; /* the lines between the matches */
    /* The colour of the winners, the scores and the match being played: lime unless the panel picks another. */
    --now: #c9f36b;
    --now-soft: rgba(201, 243, 107, .12);
  }
  * { box-sizing: border-box; }
  /* The page fills whatever size the browser source has. Everything is sized in em from the root element of the
     view (the board or the scoreboard), so the size slider in the panel scales the whole thing. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color: var(--ink); }
  [hidden] { display: none !important; }
  [data-accent="mint"] { --now: #72c99b; --now-soft: rgba(114, 201, 155, .16); }
  [data-accent="blue"] { --now: #5cc8ff; --now-soft: rgba(92, 200, 255, .15); }
  [data-accent="violet"] { --now: #a78bfa; --now-soft: rgba(167, 139, 250, .18); }
  [data-accent="yellow"] { --now: #ffd23f; --now-soft: rgba(255, 210, 63, .13); }
  [data-accent="pink"] { --now: #ff6b9a; --now-soft: rgba(255, 107, 154, .16); }
  [data-accent="white"] { --now: #ededed; --now-soft: rgba(255, 255, 255, .09); }
  [data-accent="orange"] { --now: #ff8a3d; --now-soft: rgba(255, 138, 61, .16); }

  /* ---- The whole bracket ---- */
  .stage { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; }
  .board { font-size: 20px; padding: 1.5em 1.75em 1.75em; background: rgba(11, 11, 13, .96); border: 1px solid var(--line); border-radius: 4px; opacity: 0; transition: opacity .4s ease; }
  .board.on { opacity: 1; }
  .board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 2em; margin-bottom: 1.25em; padding-bottom: 1em; border-bottom: 1px solid var(--line); }
  .title { font: 400 2.5em/1 var(--display); letter-spacing: -.02em; }
  .subtitle { font: 500 .75em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  .rounds { display: flex; gap: 2.5em; }
  .round { display: flex; flex-direction: column; }
  .round-name { margin-bottom: .75em; font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .cells { flex: 1; display: flex; flex-direction: column; }
  .cell { position: relative; flex: 1; display: flex; align-items: center; min-height: 4.75em; }

  /* The lines: each match sends one out to the right, a pair of them meets, and one goes into the next match. */
  .round:not(:last-child) .cell::after { content: ""; position: absolute; left: 100%; width: 1.25em; height: 50%; border-right: 1px solid var(--wire); }
  .round:not(:last-child) .cell:nth-child(odd)::after { top: 50%; border-top: 1px solid var(--wire); }
  .round:not(:last-child) .cell:nth-child(even)::after { top: 0; border-bottom: 1px solid var(--wire); }
  .round:not(:first-child) .cell::before { content: ""; position: absolute; right: 100%; top: 50%; width: 1.25em; border-top: 1px solid var(--wire); }
  /* The final has no partner: one straight line to the winner. */
  .round.last:not(:last-child) .cell::after { top: 50%; height: 0; border-right: 0; border-top: 1px solid var(--wire); border-bottom: 0; width: 2.5em; }

  .match { width: 15em; background: #151518; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 3px; }
  .match.live { border-color: var(--now); background: var(--now-soft); }
  .match.bye { opacity: .6; }
  .side { display: grid; grid-template-columns: 1.5em 1fr auto; align-items: center; gap: .5em; height: 2em; padding: 0 .625em 0 .5em; }
  .side + .side { border-top: 1px solid var(--line); }
  .match.live .side + .side { border-top-color: rgba(255, 255, 255, .12); }
  .mark { display: grid; place-items: center; width: 1.5em; height: 1.5em; font: 500 .625em/1 var(--mono); color: var(--muted); }
  .mark img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 400 1.25em/1.2 var(--display); }
  .num { min-width: 1.2em; text-align: right; font: 500 .9375em/1 var(--mono); color: var(--muted); }
  .side.won .who { color: var(--ink); }
  .side.won .num { color: var(--now); }
  .side.lost { opacity: .45; }
  .side.open .who { font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .num.bump { animation: bump 1.6s ease-out; }
  @keyframes bump { 0%, 40% { color: var(--bg, #0b0b0d); background: var(--now); } 100% { background: transparent; } }

  .winner { width: 13em; padding: .25em 0 .25em 0; }
  .winner .label { font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--now); }
  .winner .name { margin-top: .2em; font: italic 400 2.25em/1.05 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .winner .tag { margin-top: .5em; font: 500 .6875em/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .winner img { display: block; max-width: 4em; max-height: 4em; margin-bottom: .75em; object-fit: contain; }
  .winner .tag:empty { display: none; }

  /* ---- Only the match being played (?view=match) ---- */
  .bug-stage { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: center; padding: 40px; }
  .bug-stage.bottom { inset: auto 0 0 0; }
  .bug { font-size: 16px; min-width: 34em; background: rgba(11, 11, 13, .96); border: 1px solid var(--line); border-top: 3px solid var(--now); border-radius: 4px; opacity: 0; transition: opacity .4s ease; }
  .bug.on { opacity: 1; }
  .bug-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5em; padding: .875em 1.25em .75em; }
  .team { display: flex; align-items: center; gap: .75em; min-width: 0; }
  .team.b { flex-direction: row-reverse; text-align: right; }
  .team img { flex: none; display: block; width: 2.75em; height: 2.75em; object-fit: contain; }
  .team .text { min-width: 0; }
  .team .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 11em; font: 400 1.875em/1.1 var(--display); letter-spacing: -.01em; }
  .team .tag { margin-top: .2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 18em; font: 500 .625em/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .team .tag:empty { display: none; }
  .team.lost { opacity: .5; }
  .score { display: flex; align-items: center; gap: .5em; font: 400 2.75em/1 var(--display); }
  .score span { min-width: 1.1em; padding: .05em .15em .1em; text-align: center; border-radius: 3px; }
  .score i { font: 500 .3em/1 var(--mono); color: var(--muted); font-style: normal; }
  .score .won { color: var(--now); }
  .score .bump { animation: bump 1.6s ease-out; }
  .bug-foot { display: flex; justify-content: space-between; gap: 2em; padding: .625em 1.25em; border-top: 1px solid var(--line); font: 500 .6875em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bug-foot b { font-weight: 500; color: var(--now); }
</style>
</head>
<body>

<div class="stage" id="stage" hidden>
  <div class="board" id="board">
    <div class="board-head"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
    <div class="rounds" id="rounds"></div>
  </div>
</div>

<div class="bug-stage" id="bug-stage" hidden>
  <div class="bug" id="bug">
    <div class="bug-row">
      <div class="team a" id="team-a"></div>
      <div class="score"><span id="score-a">0</span><i>–</i><span id="score-b">0</span></div>
      <div class="team b" id="team-b"></div>
    </div>
    <div class="bug-foot"><span id="bug-title"></span><span id="bug-round"></span></div>
  </div>
</div>

<script>
(function () {
  var API = '/turnering/api';
  var TEXT = {
    da: { rounds: ['Finale', 'Semifinale', 'Kvartfinale', 'Ottendedelsfinale'], bestOf: 'Bedst af ', bye: 'Oversidder', champion: 'Vinder', open: 'Afventer', done: 'Slut' },
    en: { rounds: ['Final', 'Semifinals', 'Quarterfinals', 'Round of 16'], bestOf: 'Best of ', bye: 'Bye', champion: 'Champion', open: 'TBD', done: 'Final score' }
  };
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var profile = params.get('profile');
  var view = params.get('view') === 'match' ? 'match' : 'bracket';
  var urlScale = parseFloat(params.get('scale'));
  if (!(urlScale >= 0.5 && urlScale <= 3)) urlScale = 1;
  var seen = null; // the scores at the last drawing, so a changed one can light up; null until the first drawing

  $('stage').hidden = view !== 'bracket';
  $('bug-stage').hidden = view !== 'match';
  if (params.get('pos') === 'bottom') $('bug-stage').classList.add('bottom');

  var esc = function (text) { return String(text == null ? '' : text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  // A logo has its own address; a channel's logo needs the channel in it.
  function logoUrl(entrant) {
    return API + '/logo/' + encodeURIComponent(entrant.id) + '?v=' + encodeURIComponent(entrant.logo) + (profile ? '&profile=' + encodeURIComponent(profile) : '');
  }
  function roundName(text, rounds, index) { return text.rounds[rounds.length - 1 - index] || ''; }

  function sideHtml(match, key, byId, seeds, text, changed) {
    var id = match[key], entrant = id && byId[id];
    if (!entrant) return '<div class="side open"><span class="mark"></span><span class="who">' + esc(match.bye ? text.bye : text.open) + '</span><span class="num"></span></div>';
    var state = match.winner ? (match.winner === id ? ' won' : ' lost') : '';
    var mark = entrant.logo ? '<img src="' + esc(logoUrl(entrant)) + '" alt="">' : esc(seeds[id]);
    var scoreKey = key === 'a' ? 'scoreA' : 'scoreB';
    var num = match.bye ? '' : match[scoreKey];
    return '<div class="side' + state + '"><span class="mark">' + mark + '</span><span class="who">' + esc(entrant.name) + '</span>' +
      '<span class="num' + (changed[match.id + key] ? ' bump' : '') + '">' + num + '</span></div>';
  }

  function drawBracket(state, byId, seeds, text, changed) {
    var plan = state.plan, rounds = state.rounds;
    var board = $('board');
    board.dataset.accent = plan.accent;
    board.style.fontSize = 20 * (Number(plan.scale) || 1) * urlScale + 'px';
    $('title').textContent = plan.title || '';
    $('subtitle').textContent = [plan.subtitle, plan.bestOf ? text.bestOf + plan.bestOf : ''].filter(Boolean).join(' · ');

    var html = rounds.map(function (matches, index) {
      return '<div class="round' + (index === rounds.length - 1 ? ' last' : '') + '"><div class="round-name">' + esc(roundName(text, rounds, index)) + '</div><div class="cells">' +
        matches.map(function (match) {
          return '<div class="cell"><div class="match' + (match.id === state.live ? ' live' : '') + (match.bye ? ' bye' : '') + '">' +
            sideHtml(match, 'a', byId, seeds, text, changed) + sideHtml(match, 'b', byId, seeds, text, changed) + '</div></div>';
        }).join('') + '</div></div>';
    }).join('');

    var winner = state.champion && byId[state.champion];
    if (winner) {
      html += '<div class="round"><div class="round-name">&nbsp;</div><div class="cells"><div class="cell"><div class="winner">' +
        (winner.logo ? '<img src="' + esc(logoUrl(winner)) + '" alt="">' : '') +
        '<div class="label">' + esc(text.champion) + '</div><div class="name">' + esc(winner.name) + '</div><div class="tag">' + esc(winner.tag) + '</div></div></div></div></div>';
    }
    $('rounds').innerHTML = html;
    board.classList.toggle('on', state.entrants.length >= 2);
    fit();
  }

  // A full bracket of 16 at a big size can be wider than the picture: then the board is shrunk to fit inside it.
  function fit() {
    var board = $('board');
    board.style.transform = '';
    var ratio = Math.min(1, (window.innerWidth - 48) / board.offsetWidth, (window.innerHeight - 48) / board.offsetHeight);
    if (ratio < 1) board.style.transform = 'scale(' + ratio + ')';
  }
  window.addEventListener('resize', fit);

  function teamHtml(entrant) {
    return (entrant.logo ? '<img src="' + esc(logoUrl(entrant)) + '" alt="">' : '') +
      '<div class="text"><div class="name">' + esc(entrant.name) + '</div><div class="tag">' + esc(entrant.tag) + '</div></div>';
  }

  // The match being played; when the tournament is over, the final stays up with its result.
  function drawMatch(state, byId, text, changed) {
    var plan = state.plan, rounds = state.rounds, all = [].concat.apply([], rounds);
    var bug = $('bug');
    var match = all.filter(function (m) { return m.id === state.live; })[0] || (state.champion ? rounds[rounds.length - 1][0] : null);
    if (!match || !byId[match.a] || !byId[match.b]) { bug.classList.remove('on'); return; }
    bug.dataset.accent = plan.accent;
    bug.style.fontSize = 16 * (Number(plan.scale) || 1) * urlScale + 'px';
    [['a', 'scoreA'], ['b', 'scoreB']].forEach(function (pair) {
      var key = pair[0], id = match[key];
      var team = $('team-' + key), score = $('score-' + key);
      team.innerHTML = teamHtml(byId[id]);
      team.classList.toggle('lost', Boolean(match.winner) && match.winner !== id);
      score.textContent = match[pair[1]];
      score.classList.toggle('won', match.winner === id);
      score.classList.remove('bump');
      if (changed[match.id + key]) { void score.offsetWidth; score.classList.add('bump'); }
    });
    $('bug-title').textContent = [plan.title, plan.subtitle].filter(Boolean).join(' · ');
    $('bug-round').innerHTML = esc(roundName(text, rounds, match.round)) + ' · ' +
      (match.winner ? '<b>' + esc(text.done) + '</b>' : esc(plan.bestOf ? text.bestOf + plan.bestOf : ''));
    if (!match.winner && !plan.bestOf) $('bug-round').textContent = roundName(text, rounds, match.round);
    bug.classList.add('on');
  }

  function render(state) {
    if (!state || !state.rounds) return;
    var text = TEXT[state.plan.lang] || TEXT.da;
    var byId = {}, seeds = {};
    state.entrants.forEach(function (entrant, index) { byId[entrant.id] = entrant; seeds[entrant.id] = index + 1; });

    // Which scores went up since the last drawing (same two entrants, higher number).
    var now = {}, changed = {};
    state.rounds.forEach(function (matches) {
      matches.forEach(function (match) {
        [['a', match.scoreA], ['b', match.scoreB]].forEach(function (pair) {
          var key = match.id + pair[0], value = match.a + '|' + match.b + '|';
          now[key] = { pairing: value, score: pair[1] };
          if (seen && seen[key] && seen[key].pairing === value && pair[1] > seen[key].score) changed[key] = true;
        });
      });
    });
    seen = now;

    if (view === 'match') drawMatch(state, byId, text, changed);
    else drawBracket(state, byId, seeds, text, changed);
  }

  fetch(API + '/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
  var events = new EventSource(API + '/events');
  events.onmessage = function (event) { try { render(JSON.parse(event.data)); } catch (e) {} };
})();
</script>

</body>
</html>
