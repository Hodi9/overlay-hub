<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>GTA VI-tællere — Overlay</title>
<style>
  /* Same look as the live timer: GTA's Pricedown from the streaming PC (it is a paid font and not hosted here), else Impact. */
  @font-face {
    font-family: "Pricedown";
    src: local("Pricedown"), local("Pricedown Bl"), local("Pricedown-Black"), local("Pricedown Black");
    font-display: block;
  }
  * { box-sizing: border-box; }
  /* No background. ?layout=row puts the counters side by side (number over name), ?only=2 shows just the 2nd visible
     counter (for placing them separately), ?corner= and ?scale= place and size it, ?bg=black is for previewing. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body.bg-preview { background: #3a3f47; }

  .counters {
    --gap: 48px;
    position: absolute; top: var(--gap); left: var(--gap); font-size: 16px;
    display: grid; grid-template-columns: auto auto; column-gap: .45em; row-gap: .05em; align-items: baseline;
    font-family: "Pricedown", Impact, "Arial Black", sans-serif; color: #fff;
    -webkit-text-stroke: .09em #000; paint-order: stroke fill;
    filter: drop-shadow(0 .12em .18em rgba(0, 0, 0, .6));
    opacity: 0; transition: opacity .4s ease;
  }
  .counters.bottom { top: auto; bottom: var(--gap); }
  .counters.right { left: auto; right: var(--gap); }
  .counters.on { opacity: 1; }

  /* Number and name are the same size. */
  .num { font-size: 2.8em; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .name { font-size: 2.8em; line-height: 1; letter-spacing: .02em; }

  /* Side by side: each counter is a column with the number over its name, like the timer. */
  .counters.row { display: flex; gap: 1.2em; align-items: flex-start; }
  .counters.row .item { display: flex; flex-direction: column; align-items: center; }
  .counters.row .num { font-size: 4.5em; line-height: .9; text-align: center; }
  .counters.row .name { margin-top: .15em; font-size: 1.35em; }
  .item { display: contents; }

  /* A number that just went up pops. */
  .num.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .num { display: inline-block; transform-origin: center; }
</style>
</head>
<body>
<div class="counters" id="counters"></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var box = document.getElementById('counters');
  if (params.get('bg') === 'black') document.body.classList.add('bg-preview');
  if (params.get('layout') === 'row') box.classList.add('row');
  var corner = params.get('corner') || '';
  if (/bottom/.test(corner)) box.classList.add('bottom');
  if (/right/.test(corner)) box.classList.add('right');
  var scale = parseFloat(params.get('scale'));
  if (scale >= 0.3 && scale <= 5) box.style.fontSize = (16 * scale) + 'px';
  var only = parseInt(params.get('only'), 10);

  var previous = {}; // id -> last count shown, to pop the ones that went up

  function render(state) {
    var list = (state.counters || []).filter(function (c) { return c.visible; });
    if (only >= 1) list = list.slice(only - 1, only);
    var html = '';
    var popped = [];
    list.forEach(function (c) {
      if (previous[c.id] !== undefined && c.count > previous[c.id]) popped.push(c.id);
      previous[c.id] = c.count;
      var name = String(c.label).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; });
      html += '<div class="item"><span class="num" data-id="' + c.id + '">' + c.count + '</span><span class="name">' + name + '</span></div>';
    });
    box.innerHTML = html;
    popped.forEach(function (id) {
      var el = box.querySelector('.num[data-id="' + id + '"]');
      if (el) el.classList.add('pop');
    });
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { box.classList.add('on'); });
  }

  fetch('/gta6-counters/api/state').then(function (r) { return r.json(); }).then(render).catch(function () {});
  var events = new EventSource('/gta6-counters/api/events');
  events.onmessage = function (event) { try { render(JSON.parse(event.data)); } catch (e) {} };
})();
</script>
</body>
</html>
