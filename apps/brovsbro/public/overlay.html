<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<title>Bro vs Bro — Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root {
    --ink: #0a0a16;
    --cabinet: #1c1330;
    --cabinet-edge: #0d0819;
    --p1: #ff3864;
    --p2: #1ee8ff;
    --coin: #ffd23f;
    --bone: #f1edff;
    --bone-dim: #8f87ac;
    --shadow: rgba(0, 0, 0, 0.7);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    color: var(--bone);
    font-family: 'VT323', monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  [data-view] { display: none; }
  [data-view].active { display: block; }

  .pixel-font { font-family: 'Press Start 2P', 'VT323', monospace; }

  @keyframes blink {
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blinker { animation: none !important; opacity: 1 !important; }
  }

  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.22) 0px,
      rgba(0, 0, 0, 0.22) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }

  /* ---------- scoreboard ---------- */
  #scoreboard-view { padding: 20px; }
  .scoreboard {
    position: relative;
    display: flex;
    align-items: stretch;
    width: 660px;
    background: var(--ink);
    border: 3px solid var(--cabinet);
    box-shadow:
      0 0 0 3px var(--cabinet-edge),
      0 0 0 7px var(--cabinet),
      0 24px 50px -20px var(--shadow);
  }
  .sb-side { flex: 1; display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
  .sb-side.sb-aggo { flex-direction: row-reverse; text-align: right; }
  .sb-tag { font-size: 12px; letter-spacing: 0.05em; padding: 3px 7px; background: var(--p1); color: var(--ink); flex-shrink: 0; }
  .sb-aggo .sb-tag { background: var(--p2); }
  .sb-photo { width: 54px; height: 54px; flex-shrink: 0; overflow: hidden; image-rendering: pixelated; }
  .sb-marcelo .sb-photo { border: 3px solid var(--p1); box-shadow: 0 0 14px -2px var(--p1); }
  .sb-aggo .sb-photo { border: 3px solid var(--p2); box-shadow: 0 0 14px -2px var(--p2); }
  .sb-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; filter: grayscale(1) contrast(1.3); }
  .sb-marcelo .sb-photo img { object-position: center 40%; }
  .sb-info { display: flex; flex-direction: column; gap: 0; }
  .sb-name { font-family: 'VT323', monospace; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; font-size: 22px; line-height: 1; }
  .sb-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 26px;
    line-height: 1;
    margin-left: auto;
    transition: transform 0.2s steps(3);
  }
  .sb-aggo .sb-score { margin-left: 0; margin-right: auto; }
  .sb-marcelo .sb-score { color: var(--p1); text-shadow: 0 0 10px var(--p1); }
  .sb-aggo .sb-score { color: var(--p2); text-shadow: 0 0 10px var(--p2); }
  .sb-score.bump { transform: scale(1.25); }
  .sb-center {
    width: 96px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-left: 3px solid var(--cabinet);
    border-right: 3px solid var(--cabinet);
    background: repeating-linear-gradient(-45deg, #100a1f 0 4px, #150e26 4px 8px);
  }
  .sb-center .vs-diamond {
    width: 30px;
    height: 30px;
    background: var(--coin);
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sb-center .vs-diamond span {
    transform: rotate(-45deg);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--ink);
  }
  .sb-center .round-num { font-family: 'VT323', monospace; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--coin); }
  .sb-center .dyst-name { font-family: 'VT323', monospace; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--bone); max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- fight card / character select ---------- */
  #fightcard-view {
    width: 100vw;
    height: 100vh;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    overflow: hidden;
  }
  #fightcard-view.active { display: flex; }
  #fightcard-view .stage { width: 1920px; height: 1080px; flex-shrink: 0; transform-origin: center center; }
  .hero { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .hero-inner { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; }

  .corner { position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .corner.marcelo-corner { background: #170a12; }
  .corner.aggo-corner { background: #061a1e; }
  .corner-photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 30%;
    filter: grayscale(1) contrast(1.3) brightness(0.8);
    image-rendering: pixelated;
  }
  .corner.marcelo-corner .corner-photo { object-position: center 40%; mix-blend-mode: luminosity; }
  .corner.aggo-corner .corner-photo { object-position: center 50%; mix-blend-mode: luminosity; }
  .corner.marcelo-corner::before, .corner.aggo-corner::before {
    content: ""; position: absolute; inset: 0; z-index: 1; mix-blend-mode: color;
  }
  .corner.marcelo-corner::before { background: var(--p1); }
  .corner.aggo-corner::before { background: var(--p2); }
  .corner.marcelo-corner::after, .corner.aggo-corner::after {
    content: ""; position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(0deg, var(--ink) 0%, transparent 42%);
  }

  .pixel-scan {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 2px, transparent 3px, transparent 5px);
    mix-blend-mode: multiply;
  }

  .corner-label { position: relative; z-index: 4; width: 100%; padding: 44px 64px 60px; display: flex; flex-direction: column; gap: 14px; }
  .marcelo-corner .corner-label { text-align: left; align-items: flex-start; }
  .aggo-corner .corner-label { text-align: right; align-items: flex-end; }
  .corner-tag { font-family: 'Press Start 2P', monospace; font-size: 20px; padding: 8px 16px; color: var(--ink); }
  .marcelo-corner .corner-tag { background: var(--p1); }
  .aggo-corner .corner-tag { background: var(--p2); }
  .corner-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 92px;
    line-height: 1;
    text-transform: uppercase;
    color: var(--bone);
  }
  .marcelo-corner .corner-name { text-shadow: 6px 6px 0 var(--p1); }
  .aggo-corner .corner-name { text-shadow: -6px 6px 0 var(--p2); }

  .center-divider {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 0; z-index: 5;
    transform: translateX(-50%);
    border-left: 6px dashed var(--coin);
    opacity: 0.9;
  }
  .hero-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 7; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hero-title .lockup {
    font-family: 'Press Start 2P', monospace;
    font-size: 65px;
    letter-spacing: 0.02em;
    color: var(--bone);
    text-shadow: 5px 5px 0 var(--p1), 11px 11px 0 var(--p2);
  }
  .hero-title .lockup-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    letter-spacing: 0.12em;
    color: var(--coin);
    text-shadow: 3px 3px 0 var(--ink);
  }

  #duel-view.active { display: flex; }
  .duel-bar {
    display: flex;
    align-items: center;
    width: fit-content;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6));
  }
  .duel-avatar {
    width: 76px; height: 76px; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--coin); background: var(--cabinet);
    box-shadow: 0 0 0 3px var(--ink); flex-shrink: 0; position: relative; z-index: 2;
  }
  .duel-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .duel-avatar.left { margin-right: -22px; }
  .duel-avatar.right { margin-left: -22px; }
  .duel-name {
    height: 60px; display: flex; align-items: center; font-size: 28px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--ink); white-space: nowrap;
    transition: box-shadow .2s ease;
  }
  .duel-name.left { background: var(--p1); padding: 0 30px 0 38px; }
  .duel-name.right { background: var(--p2); padding: 0 38px 0 30px; }
  .duel-score {
    height: 60px; min-width: 60px; display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--bone); font-size: 38px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .duel-sets { height: 60px; display: flex; align-items: center; gap: 5px; padding: 0 12px; background: var(--cabinet); }
  .duel-sets .pip { width: 11px; height: 11px; border-radius: 50%; background: rgba(241, 237, 255, .22); }
  .duel-sets .pip.on-left { background: var(--p1); }
  .duel-sets .pip.on-right { background: var(--p2); }
  .duel-bar.p1-winner .duel-name.left { box-shadow: inset 0 0 0 3px var(--coin); }
  .duel-bar.p2-winner .duel-name.right { box-shadow: inset 0 0 0 3px var(--coin); }
</style>
</head>
<body>

  <div id="scoreboard-view" data-view>
    <div class="scoreboard">
      <div class="sb-side sb-marcelo">
        <span class="sb-tag pixel-font">P1</span>
        <div class="sb-photo"><img src="/brovsbro/images/marcelo.png" alt="Marcelo" /></div>
        <div class="sb-info"><span class="sb-name">Marcelo</span></div>
        <span class="sb-score" id="sb-marcelo-score">0</span>
      </div>
      <div class="sb-center">
        <div class="vs-diamond"><span>VS</span></div>
        <span class="round-num" id="sb-round-num">Runde 1</span>
        <span class="dyst-name" id="sb-dyst-name"></span>
      </div>
      <div class="sb-side sb-aggo">
        <span class="sb-score" id="sb-aggo-score">0</span>
        <div class="sb-info"><span class="sb-name">Aggo</span></div>
        <div class="sb-photo"><img src="/brovsbro/images/aggo.png" alt="Aggo" /></div>
        <span class="sb-tag pixel-font">P2</span>
      </div>
    </div>
  </div>

  <div id="fightcard-view" data-view>
   <div class="stage">
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-title"><span class="lockup">BRO VS BRO</span><span class="lockup-sub">IRL EDITION</span></div>
        <div class="corner marcelo-corner">
          <img class="corner-photo" src="/brovsbro/images/marcelo.png" alt="Marcelo" />
          <div class="pixel-scan"></div>
          <div class="corner-label">
            <span class="corner-tag">PLAYER 1</span>
            <span class="corner-name">Marcelo</span>
          </div>
        </div>
        <div class="corner aggo-corner">
          <img class="corner-photo" src="/brovsbro/images/aggo.png" alt="Aggo" />
          <div class="pixel-scan"></div>
          <div class="corner-label">
            <span class="corner-tag">PLAYER 2</span>
            <span class="corner-name">Aggo</span>
          </div>
        </div>
        <div class="center-divider"></div>
      </div>
      <div class="scanlines"></div>
    </div>
   </div>
  </div>

  <div id="duel-view" data-view>
    <div class="duel-bar" id="duel-bar">
      <div class="duel-avatar left"><img src="/brovsbro/images/marcelo.png" alt="Marcelo" /></div>
      <div class="duel-name left">Marcelo</div>
      <div class="duel-sets" id="duel-sets-left"></div>
      <div class="duel-score" id="duel-score-left">0</div>
      <div class="duel-score" id="duel-score-right">0</div>
      <div class="duel-sets" id="duel-sets-right"></div>
      <div class="duel-name right">Aggo</div>
      <div class="duel-avatar right"><img src="/brovsbro/images/aggo.png" alt="Aggo" /></div>
    </div>
  </div>

<script src="/brovsbro/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const view = params.get("view") || "scoreboard";
  document.querySelectorAll("[data-view]").forEach((el) => el.classList.remove("active"));
  const active = document.getElementById(view + "-view");
  (active || document.getElementById("scoreboard-view")).classList.add("active");

  function scaleStage() {
    const stage = document.querySelector("#fightcard-view .stage");
    if (!stage) return;
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + scale + ")";
  }
  scaleStage();
  window.addEventListener("resize", scaleStage);

  const socket = io({ path: "/brovsbro/socket.io" });
  let lastScores = { marcelo: 0, aggo: 0 };

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  socket.on("state", (state) => {
    const sbM = document.getElementById("sb-marcelo-score");
    const sbA = document.getElementById("sb-aggo-score");
    if (sbM) { if (state.scores.marcelo !== lastScores.marcelo) bump(sbM); sbM.textContent = state.scores.marcelo; }
    if (sbA) { if (state.scores.aggo !== lastScores.aggo) bump(sbA); sbA.textContent = state.scores.aggo; }
    const rn = document.getElementById("sb-round-num");
    if (rn) rn.textContent = "Runde " + state.round;
    const dn = document.getElementById("sb-dyst-name");
    if (dn) {
      const dystName = state.current?.name || "";
      dn.textContent = dystName;
      dn.style.display = dystName ? "block" : "none";
    }

    lastScores = { ...state.scores };

    const duel = state.duel || { points: { marcelo: 0, aggo: 0 }, sets: { marcelo: 0, aggo: 0 } };
    const duelScoreLeft = document.getElementById("duel-score-left");
    const duelScoreRight = document.getElementById("duel-score-right");
    const duelSetsLeft = document.getElementById("duel-sets-left");
    const duelSetsRight = document.getElementById("duel-sets-right");
    const duelBarEl = document.getElementById("duel-bar");
    if (duelScoreLeft) duelScoreLeft.textContent = duel.points.marcelo;
    if (duelScoreRight) duelScoreRight.textContent = duel.points.aggo;
    if (duelSetsLeft) renderDuelPips(duelSetsLeft, duel.sets.marcelo, "left");
    if (duelSetsRight) renderDuelPips(duelSetsRight, duel.sets.aggo, "right");
    if (duelBarEl) {
      duelBarEl.classList.toggle("p1-winner", duel.sets.marcelo >= 3);
      duelBarEl.classList.toggle("p2-winner", duel.sets.aggo >= 3);
    }
  });

  function renderDuelPips(container, count, side) {
    const total = Math.max(count, 3);
    container.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const el = document.createElement("div");
      el.className = "pip" + (i < count ? " on-" + side : "");
      container.appendChild(el);
    }
  }
</script>
</body>
</html>
