<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Card Overlay — Kontrolpanel</title>
<style>
  :root{--bg:#0d0b14;--panel:#17131f;--panel2:#201a2b;--line:#352b46;--text:#f7f2ff;--muted:#a79db8;--gold:#f2ca61;--danger:#ff7086;--ok:#74dba5}*{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 80% 0,rgba(242,202,97,.09),transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;padding:34px 18px 70px}.wrap{max-width:860px;margin:auto}h1{margin:0;font-size:clamp(26px,5vw,38px)}header p,.hint{color:var(--muted)}header a,a{color:var(--gold)}section{margin-top:24px}.label{margin:0 0 9px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.box,.list{background:var(--panel);border:1px solid var(--line);border-radius:14px}.box{padding:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:9px}
  input,select{min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:10px 11px;font:inherit}input{flex:1}select{flex:none}.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--gold);color:#231a06;font-weight:900;cursor:pointer}.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.5}.status{min-height:18px;margin-top:8px;color:var(--muted);font-size:12px}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}
  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px;flex-wrap:wrap}.toolbar .right{display:flex;gap:8px;align-items:center}.count{color:var(--muted);font-size:12px}.cards{overflow:hidden}.card-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line)}.card-row:last-child{border-bottom:0}.card-row.off{opacity:.45}.thumb{width:48px;height:67px;object-fit:contain;border-radius:5px;background:#0a0810}.card-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:5px}.icon{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:7px 9px;cursor:pointer}.icon.danger{color:var(--danger)}footer{color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:600px){.card-row{grid-template-columns:42px minmax(0,1fr)}.actions{grid-column:2}.thumb{width:42px;height:59px}}
</style>
</head>
<body><div class="wrap">
<header><h1>Pokémon Card Overlay</h1><p>Styr både <a href="/pokemon/?set=30th-celebration&bg=black" target="_blank">30th Celebration</a>, <a href="/pokemon/?set=ascended-heroes&bg=black" target="_blank">Ascended Heroes</a> og <a href="/pokemon/?set=all&bg=black" target="_blank">alle kort samlet</a>.</p></header>
<section><p class="label">Adgangskode</p><div class="box"><div class="row"><input type="password" id="token" placeholder="Adgangskode" autocomplete="off"><button class="btn" id="save-token">Gem</button></div><div class="status" id="token-status"></div></div></section>
<section><p class="label">Collectr-opdatering</p><div class="box"><p class="hint">Henter de 30 højest prissatte kort, som Collectrs offentlige 30th Celebration-side viser, inklusive aktuelle USD-priser.</p><div class="row"><button class="btn" id="import">Opdater fra Collectr</button><a href="https://app.getcollectr.com/sets/category/3/30th-celebration?groupId=24722&cardType=cards&sortType=price&sortOrder=DESC" target="_blank">Åbn kilden</a></div><div class="status" id="import-status"></div></div></section>
<section><p class="label">Tilføj kort manuelt</p><div class="box"><div class="row"><select id="set"><option value="30th-celebration">30th Celebration</option><option value="ascended-heroes">Ascended Heroes</option></select><input id="name" placeholder="Kortnavn"><input id="number" placeholder="Nr., fx 158/128"></div><div class="row"><input id="image" placeholder="Billed-URL"><input id="rarity" placeholder="Raritet"><input id="price" placeholder="Pris, fx $49.99"><button class="btn" id="add">Tilføj</button></div><div class="status" id="add-status"></div></div></section>
<section><div class="toolbar"><p class="label" style="margin:0">Kort</p><div class="right"><select id="filter"><option value="30th-celebration">30th Celebration</option><option value="ascended-heroes">Ascended Heroes</option><option value="all">Alle sæt</option></select><span class="count" id="count">0 kort</span></div></div><div class="list cards" id="cards"></div></section>
<footer id="sync"></footer>
</div>
<script>
(function(){
  var KEY='pokemon-control-token',token=document.getElementById('token'),status=document.getElementById('token-status'),filter=document.getElementById('filter'),cardsEl=document.getElementById('cards');
  function getToken(){try{return localStorage.getItem(KEY)||''}catch(e){return''}}function headers(json){var h={'x-pokemon-key':getToken()};if(json)h['Content-Type']='application/json';return h}function msg(el,text,kind){el.textContent=text;el.className='status'+(kind?' '+kind:'')}
  token.value=getToken();if(token.value)msg(status,'Kode gemt på denne enhed.','ok');document.getElementById('save-token').onclick=function(){try{localStorage.setItem(KEY,token.value.trim())}catch(e){}msg(status,'Kode gemt på denne enhed.','ok')};
  function api(url,options){return fetch(url,options).then(function(r){return r.json().catch(function(){return{}}).then(function(data){if(!r.ok)throw new Error(data.error||'Noget gik galt.');return data})})}
  function load(){api('/pokemon/api/state?set='+encodeURIComponent(filter.value)).then(render).catch(function(e){cardsEl.textContent=e.message})}
  function render(state){cardsEl.innerHTML='';document.getElementById('count').textContent=(state.cards||[]).length+' kort';document.getElementById('sync').textContent=state.lastSync?'Senest opdateret fra Collectr: '+new Date(state.lastSync).toLocaleString('da-DK'):(state.lastSyncError||'Collectr-data er indlæst fra den medfølgende sikkerhedskopi.');(state.cards||[]).forEach(function(c){var row=document.createElement('div');row.className='card-row'+(c.visible===false?' off':'');var img=document.createElement('img');img.className='thumb';img.src=c.image||'';img.alt='';row.appendChild(img);var info=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div');name.className='card-name';name.textContent=c.name;meta.className='card-meta';meta.textContent=[c.rarity,c.number,c.price,c.source].filter(Boolean).join(' · ');info.append(name,meta);row.appendChild(info);var actions=document.createElement('div');actions.className='actions';var vis=document.createElement('button');vis.className='icon';vis.textContent=c.visible===false?'Vis':'Skjul';vis.onclick=function(){patch(c.id,{visible:c.visible===false})};var del=document.createElement('button');del.className='icon danger';del.textContent='Fjern';del.onclick=function(){if(confirm('Fjern '+c.name+'?'))remove(c.id)};actions.append(vis,del);row.appendChild(actions);cardsEl.appendChild(row)})}
  function patch(id,data){api('/pokemon/api/cards/'+encodeURIComponent(id),{method:'PATCH',headers:headers(true),body:JSON.stringify(data)}).then(load).catch(function(e){alert(e.message)})}function remove(id){api('/pokemon/api/cards/'+encodeURIComponent(id),{method:'DELETE',headers:headers()}).then(load).catch(function(e){alert(e.message)})}
  document.getElementById('import').onclick=function(){var btn=this,out=document.getElementById('import-status');btn.disabled=true;msg(out,'Henter…');api('/pokemon/api/import/30th',{method:'POST',headers:headers()}).then(function(s){msg(out,s.imported+' kort blev opdateret.','ok');load()}).catch(function(e){msg(out,e.message,'error')}).finally(function(){btn.disabled=false})};
  document.getElementById('add').onclick=function(){var out=document.getElementById('add-status'),body={setId:document.getElementById('set').value,name:document.getElementById('name').value,image:document.getElementById('image').value,number:document.getElementById('number').value,rarity:document.getElementById('rarity').value,price:document.getElementById('price').value};api('/pokemon/api/cards',{method:'POST',headers:headers(true),body:JSON.stringify(body)}).then(function(){['name','image','number','rarity','price'].forEach(function(id){document.getElementById(id).value=''});msg(out,'Kortet blev tilføjet.','ok');filter.value=body.setId;load()}).catch(function(e){msg(out,e.message,'error')})};filter.onchange=load;load();setInterval(load,10000);
})();
</script></body></html>
