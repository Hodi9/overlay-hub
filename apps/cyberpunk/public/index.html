<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk 2077 Story Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{ --accent:#fcee0a; --bar:#fcee0a; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Oswald',sans-serif;display:flex;align-items:flex-start;justify-content:flex-start;height:100vh;padding:40px;}
  body.bg-preview{background:#0a0a0a;}

  .tracker{max-width:640px;opacity:0;transition:opacity .4s ease;}
  .tracker.ready{opacity:1;}

  .percent{font-size:3.75rem;font-weight:700;text-transform:uppercase;letter-spacing:-0.025em;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
  .label{margin-top:4px;font-size:0.875rem;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,255,255,.75);}
  .scope{margin-top:2px;font-size:0.875rem;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.9);}

  .bar-rail{margin-top:12px;height:16px;width:100%;border-radius:3px;border:2px solid #fff;padding:3px;}
  .bar-fill{height:100%;border-radius:1px;border-right:2px solid #fff;background:var(--bar);width:0%;transition:width .7s ease;}

  .count{margin-top:12px;font-size:2.25rem;font-weight:700;text-transform:uppercase;letter-spacing:-0.025em;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
  .section{margin-top:4px;font-size:1.25rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,.85);min-height:1.5em;}

  .current{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:1.125rem;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);}
  .current .bullet{flex:none;width:8px;height:8px;transform:rotate(45deg);background:var(--accent);}
  .current .text{text-shadow:0 2px 8px rgba(0,0,0,.9);}
  /* The current job is in progress, not done — the count above only has finished jobs. */
  .current .phase{flex:none;font-size:0.75rem;font-weight:600;letter-spacing:0.14em;line-height:1;padding:3px 7px;border:2px solid rgba(255,255,255,.75);border-radius:3px;color:rgba(255,255,255,.9);text-shadow:0 2px 8px rgba(0,0,0,.9);}

  .idle{font-size:1.25rem;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:0.1em;}
</style>
</head>
<body>
<div class="tracker" id="tracker">
  <div id="content"></div>
</div>

<script type="module">
import { computeProgress } from '/cyberpunk/progress.js';

// ?pl=off (or 0/no/false) leaves Phantom Liberty out of the percentage and
// count; anything else — including no parameter — counts it. The overlay
// always prints which of the two it is showing.
var params = new URLSearchParams(location.search);
if (params.get('bg') === 'black') document.body.classList.add('bg-preview');
var profile = params.get('profile') || '';
var qs = profile ? ('?profile=' + encodeURIComponent(profile)) : '';
var includePhantom = !/^(off|0|no|false)$/i.test(params.get('pl') || '');

var box = document.getElementById('tracker');
var content = document.getElementById('content');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function sectionText(job){
  if (!job) return '';
  var act = job.location || '';
  if (job.part === 'phantom') return 'Phantom Liberty' + (act ? ' · ' + act : '');
  return act;
}

function render(state){
  box.classList.add('ready');
  var idx = typeof state.currentIndex === 'number' ? state.currentIndex : -1;

  if (idx < 0){
    content.innerHTML = '<div class="idle">Ikke startet endnu</div>';
    return;
  }

  var p = computeProgress(state.chapters, idx, includePhantom);

  var sectionHtml = '';
  var currentHtml = '';
  if (p.finished){
    sectionHtml = 'Gennemført';
    currentHtml = '<span class="bullet"></span><span class="text">Historien er fuldført</span>';
  } else if (state.current){
    sectionHtml = escapeHtml(sectionText(state.current));
    currentHtml = '<span class="bullet"></span><span class="phase">Started</span><span class="text">' + escapeHtml(state.current.day || '') + '</span>';
  }

  content.innerHTML =
    '<div class="percent">' + p.percent.toFixed(1) + '%</div>' +
    '<div class="label">Tracked Main Job Progress</div>' +
    '<div class="scope">' + (includePhantom ? 'Includes Phantom Liberty' : 'Excludes Phantom Liberty') + '</div>' +
    '<div class="bar-rail"><div class="bar-fill" style="width:' + p.percent + '%"></div></div>' +
    '<div class="count">' + p.completed + ' / ' + p.total + ' Main Jobs</div>' +
    '<div class="section">' + sectionHtml + '</div>' +
    '<div class="current">' + currentHtml + '</div>';
}

fetch('/cyberpunk/api/state' + qs).then(function(r){ return r.json(); }).then(render).catch(function(){});

var events = new EventSource('/cyberpunk/api/events' + qs);
events.onmessage = function(event){
  try { render(JSON.parse(event.data)); } catch(e){}
};
</script>
</body>
</html>
