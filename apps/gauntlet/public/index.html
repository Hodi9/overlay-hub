<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Gauntlet Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Press+Start+2P&family=Black+Ops+One&family=Cinzel:wght@600;700&family=Bebas+Neue&family=Bungee&family=Lilita+One&family=Teko:wght@600;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Rajdhani',sans-serif;}

  .badges{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;width:max-content;}
  .badge{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    height:56px;
    padding:5px 13px 5px 5px;
    border-radius:11px;
    font-weight:700;
    font-size:1.18rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
    border:3px solid rgba(10,12,16,.72);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 rgba(0,0,0,.42),0 6px 10px rgba(0,0,0,.24);
    overflow:hidden;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .badge::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 48%,rgba(0,0,0,.08));pointer-events:none;}
  .badge-name{position:relative;z-index:1;white-space:nowrap;line-height:1;}
  /* Being played now: a bright frame around the badge. */
  .badge.current{
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.42),0 0 0 3px #fff,0 0 16px 3px rgba(255,255,255,.6);
    transform:translateX(6px);
    animation:now 2.2s ease-in-out infinite;
  }
  @keyframes now{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.42),0 0 0 3px #fff,0 0 7px 1px rgba(255,255,255,.3);}}
  @media (prefers-reduced-motion:reduce){.badge.current{animation:none;}}
  .resets{
    display:inline-flex;align-items:center;gap:10px;height:40px;margin-top:4px;padding:0 13px;border-radius:11px;
    background:#050609;border:3px solid rgba(8,10,14,.9);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 rgba(0,0,0,.48),0 6px 10px rgba(0,0,0,.25);
    font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;
  }
  .resets b{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.25rem;letter-spacing:0;font-variant-numeric:tabular-nums;}
  /* The record sits to the right of the game it belongs to, pointing at it. */
  .badge-row{display:flex;align-items:center;gap:18px;}
  .best::before{content:'';position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right:9px solid #050609;}
  .best{
    position:relative;
    display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 13px;border-radius:11px;
    background:#050609;border:3px solid rgba(8,10,14,.9);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 rgba(0,0,0,.48),0 6px 10px rgba(0,0,0,.25);
    font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
  }
  .best b{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.1rem;letter-spacing:0;color:#ffd23f;font-variant-numeric:tabular-nums;}
  /* The win: a gold box above the games, and the badges jiggle one after the other down the list. */
  .champions{
    position:relative;display:inline-flex;align-items:center;gap:12px;height:68px;margin-bottom:4px;padding:4px 22px 0 14px;border-radius:11px;
    background:linear-gradient(180deg,#ffe680,#ffc928 55%,#f0a400);border:3px solid #6e4a00;color:#2a1a00;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 rgba(0,0,0,.42),0 0 22px 4px rgba(255,205,60,.55);
    font-family:'Bebas Neue','Rajdhani',sans-serif;font-weight:400;font-size:2.3rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;line-height:1;
    overflow:hidden;animation:champ-glow 2.2s ease-in-out infinite;
  }
  .champions.pop{animation:champ-pop .7s cubic-bezier(.2,1.5,.4,1) both,champ-glow 2.2s ease-in-out .7s infinite;}
  .champions svg{width:40px;height:40px;flex:none;margin-top:-4px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5));}
  /* A band of light that runs across the box now and then. */
  .champions::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:champ-shine 3.2s ease-in-out infinite;}
  @keyframes champ-pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes champ-glow{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 rgba(0,0,0,.42),0 0 34px 9px rgba(255,215,90,.85);}}
  @keyframes champ-shine{0%,55%{left:-40%;}100%{left:130%;}}
  .celebrating .badge{animation:jiggle 2.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * .13s);}
  @keyframes jiggle{
    0%,52%,100%{transform:rotate(0) translateY(0);}
    60%{transform:rotate(-3.5deg) translateY(-4px);}
    68%{transform:rotate(3deg) translateY(0);}
    76%{transform:rotate(-2.2deg) translateY(-2px);}
    84%{transform:rotate(1.4deg) translateY(0);}
    92%{transform:rotate(-.6deg);}
  }
  @media (prefers-reduced-motion:reduce){.champions,.champions.pop,.champions::after,.celebrating .badge{animation:none;}}
  .game-mark{position:relative;z-index:1;width:48px;height:46px;margin-left:-2px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;font-size:1.22rem;color:#fff;border-right:2px solid rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .game-mark svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
  .game-mark img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));}
  .badge.done .game-mark{background:rgba(0,0,0,.14);}
  .game-mark .completion-check{width:34px;height:34px;color:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.32));}
  .badge.fortnite .game-mark{font-size:1.5rem;}
  .badge.fortnite{background:#258cf0!important;}
  .badge.warzone{background:#b99a00!important;}
  .badge.minecraft{background:#3f9144!important;}
  .badge.lol{background:#10aaa8!important;}
  .badge.rocketleague{background:#ef651d!important;}
  .badge.fallguys{background:#ee3f96!important;border-color:#8f2358!important;}
  .badge.cswingman{background:#4d6f9c!important;border-color:#2f4562!important;}
  .badge.apex{background:#c4302b!important;border-color:#7a1d1a!important;}
  /* Completed: green, with a check mark where the game's mark was. After the games' own colours, so it wins. */
  .badge.done{background:#34c76b!important;border-color:#1b7a40!important;}
  .badge.done .badge-name{color:#fff;}
  .badge.fortnite .badge-name{font-size:1.28rem;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.28);transform:scaleY(1.08);}
  .badge.warzone .badge-name{font-size:1.22rem;letter-spacing:.025em;text-shadow:0 2px 0 rgba(0,0,0,.38);}
  .badge.minecraft .badge-name{font-size:.92rem;letter-spacing:.015em;-webkit-text-stroke:0;text-shadow:1px 2px 0 #252525;}
  .badge.lol .badge-name{font-size:1.02rem;font-weight:800;color:#fff5c7;text-shadow:0 1px 0 #4d3210,1px 0 0 #4d3210;}
  .badge.rocketleague .badge-name{font-size:1.55rem;font-style:italic;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.34);}
  .badge.fallguys .badge-name{font-size:1.28rem;font-weight:400;letter-spacing:.02em;text-shadow:0 2px 0 rgba(120,20,70,.55);}
  .badge.cswingman .badge-name{font-size:1.62rem;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.34);}
  .badge.cswingman .game-mark{font-size:1.6rem;font-weight:700;}
  .badge.apex .badge-name{font-size:1.15rem;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.38);}
  .badge-logo{position:relative;z-index:1;height:28px;width:auto;max-width:72px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));flex:none;display:block;}
  .badge.fortnite .badge-logo,.badge.warzone .badge-logo,.badge.minecraft .badge-logo{height:29px;max-width:145px;margin:auto;}
  .badge.fortnite .badge-name,.badge.warzone .badge-name{font-size:1.28rem;}
  .badge.minecraft .badge-name{font-size:.83rem;}
  .game-wordmark{position:relative;z-index:1;height:31px;width:auto;max-width:150px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.38));}
</style>
</head>
<body>
<div class="badges" id="badges"></div>

<script src="game-theme.js"></script>
<script>
(function(){
  var creeperIcon = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="2" width="2" height="2" fill="#0b0c10"/><rect x="5" y="2" width="2" height="2" fill="#0b0c10"/><rect x="3" y="3" width="2" height="1" fill="#0b0c10"/><rect x="2" y="4" width="1" height="2" fill="#0b0c10"/><rect x="5" y="4" width="1" height="2" fill="#0b0c10"/><rect x="3" y="4" width="2" height="2" fill="#0b0c10"/></svg>';
  // Hand-drawn marks (not the official logos) for games without a logo file.
  var themeMarks = {
    fallguys: '<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="6" fill="#fff"/><ellipse cx="10.2" cy="9.2" rx="1.5" ry="2" fill="#1c1c28"/><ellipse cx="14.4" cy="9.2" rx="1.5" ry="2" fill="#1c1c28"/><path d="M8.2 12.6c1.2 1.6 6.4 1.6 7.6 0" stroke="#ee3f96" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>',
    cswingman: '<span>CS</span>',
    apex: '<svg viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M12 2 23 21.5h-5.2L12 11.2 6.2 21.5H1z"/><path fill="#fff" d="M9.4 21.5 12 16.9l2.6 4.6z"/></svg>'
  };
  var checkIcon ='<svg class="completion-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8.5L6.1 12L13.5 4" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var crownIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#2a1a00" d="M3.2 17.5h17.6L22.6 7l-5.4 4.2L12 3.5 6.8 11.2 1.4 7z"/><rect x="3.2" y="19" width="17.6" height="2.6" rx="1" fill="#2a1a00"/></svg>';
  var celebrating = false; // whether the win was showing at the last draw, so the box only pops in when it is switched on

  function isDoneOf(g){ return g.type === 'count' ? g.count > 0 : g.done; }

  // The games stay in the order of the gauntlet; a completed one is greyed out where it stands.
  function render(state){
    var games = state.games || [];
    var sorted = games.filter(function(g){ return g.visible !== false; });

    var badgesEl = document.getElementById('badges');
    badgesEl.innerHTML = '';

    // The win: every game is completed. A gold box on top, and the badges jiggle.
    var won = state.champions === true;
    badgesEl.classList.toggle('celebrating', won);
    if (won) {
      var champions = document.createElement('div');
      champions.className = 'champions' + (celebrating ? '' : ' pop');
      champions.innerHTML = crownIcon + '<span>Gaming Gauntlet Champions</span>';
      badgesEl.appendChild(champions);
    }
    celebrating = won;

    sorted.forEach(function(g, index){
      var badge = document.createElement('div');
      var themeClass = (window.GauntletTheme && window.GauntletTheme.classFor(g)) || 'generic';
      var isDone = isDoneOf(g);
      badge.className = 'badge ' + themeClass + (isDone ? ' done' : '') + (!isDone && g.id === state.current ? ' current' : '');
      badge.style.setProperty('--i', index);
      badge.style.background = g.color;
      badge.style.borderColor = 'color-mix(in srgb, ' + g.color + ' 65%, black)';
      badge.style.fontFamily = (window.GauntletTheme && window.GauntletTheme.fontFor(g)) || '';
      var logoUrl = window.GauntletTheme && window.GauntletTheme.logoFor(g);
      var isCrestLogo = themeClass === 'lol' || themeClass === 'rocketleague';
      var mark = isDone
        ? checkIcon
        : (g.icon === 'creeper' ? creeperIcon
          : (themeMarks[themeClass] ? themeMarks[themeClass]
            : (isCrestLogo && logoUrl ? '<img src="' + logoUrl + '" alt="' + g.name + '">' : '<span>' + g.icon + '</span>')));
      var name = themeClass === 'minecraft' && logoUrl
        ? '<img class="game-wordmark" src="' + logoUrl + '" alt="Minecraft">'
        : '<span class="badge-name">' + g.name + '</span>';
      badge.innerHTML = '<span class="game-mark">' + mark + '</span>' + name;
      // The record: the game furthest down the list that has been reached so far, and how many times.
      if (g.id === state.best && state.showBest !== false) {
        var row = document.createElement('div');
        row.className = 'badge-row';
        var best = document.createElement('div');
        best.className = 'best';
        var label = document.createElement('span'); label.textContent = 'PR';
        var times = document.createElement('b'); times.textContent = Number(state.bestCount) || 1;
        best.appendChild(label); best.appendChild(times);
        row.appendChild(badge); row.appendChild(best);
        badgesEl.appendChild(row);
        return;
      }
      badgesEl.appendChild(badge);
    });

    if (state.showResets !== false) {
      var resets = document.createElement('div');
      resets.className = 'resets';
      resets.innerHTML = '<span>Resets</span><b>' + (Number(state.resets) || 0) + '</b>';
      badgesEl.appendChild(resets);
    }
  }

  // A new version of this page on the server: load it, so nobody has to refresh the browser source in OBS.
  var pageVersion = null;
  function fresh(state){
    if (state && state.version) {
      if (pageVersion && pageVersion !== state.version) { location.reload(); return false; }
      pageVersion = state.version;
    }
    return true;
  }

  fetch('/gauntlet/api/state').then(function(r){ return r.json(); }).then(function(s){ if (fresh(s)) render(s); }).catch(function(){});

  var events = new EventSource('/gauntlet/api/events');
  events.onmessage = function(event){
    try { var s = JSON.parse(event.data); if (fresh(s)) render(s); } catch(e){}
  };
})();
</script>
</body>
</html>
