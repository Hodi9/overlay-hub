<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Gauntlet Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Press+Start+2P&family=Black+Ops+One&family=Cinzel:wght@600;700&family=Bebas+Neue&family=Bungee&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Rajdhani',sans-serif;}

  .badges{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;width:max-content;}
  .badge{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    height:56px;
    padding:5px 13px 5px 5px;
    border-radius:11px;
    font-weight:700;
    font-size:1.18rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
    border:3px solid rgba(10,12,16,.72);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 rgba(0,0,0,.42),0 6px 10px rgba(0,0,0,.24);
    overflow:hidden;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .badge::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 48%,rgba(0,0,0,.08));pointer-events:none;}
  .badge-name{position:relative;z-index:1;white-space:nowrap;line-height:1;}
  .badge.done{
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.42),0 0 0 2px #52db38,0 0 12px rgba(82,219,56,.48);
    transform:translateY(-1px);
  }
  .game-mark{position:relative;z-index:1;width:48px;height:46px;margin-left:-2px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;font-size:1.22rem;color:#fff;border-right:2px solid rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .game-mark svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));}
  .game-mark img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));}
  .badge.done .game-mark{background:rgba(0,0,0,.14);}
  .game-mark .completion-check{width:34px;height:34px;color:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.32));}
  .badge.fortnite{background:#258cf0!important;}
  .badge.warzone{background:#b99a00!important;}
  .badge.minecraft{background:#3f9144!important;}
  .badge.lol{background:#10aaa8!important;}
  .badge.rocketleague{background:#ef651d!important;}
  .badge.fortnite .badge-name{font-size:1.28rem;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.28);transform:scaleY(1.08);}
  .badge.warzone .badge-name{font-size:1.22rem;letter-spacing:.025em;text-shadow:0 2px 0 rgba(0,0,0,.38);}
  .badge.minecraft .badge-name{font-size:.92rem;letter-spacing:.015em;-webkit-text-stroke:0;text-shadow:1px 2px 0 #252525;}
  .badge.lol .badge-name{font-size:1.02rem;color:#fff5c7;text-shadow:0 1px 0 #4d3210,1px 0 0 #4d3210;}
  .badge.rocketleague .badge-name{font-size:1.55rem;font-style:italic;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.34);}
  .badge-logo{position:relative;z-index:1;height:28px;width:auto;max-width:72px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));flex:none;display:block;}
  .badge.fortnite .badge-logo,.badge.warzone .badge-logo,.badge.minecraft .badge-logo{height:29px;max-width:145px;margin:auto;}
  .badge.fortnite .badge-name,.badge.warzone .badge-name{font-size:1.28rem;}
  .badge.minecraft .badge-name{font-size:.83rem;}
  .game-wordmark{position:relative;z-index:1;height:31px;width:auto;max-width:150px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.38));}
</style>
</head>
<body>
<div class="badges" id="badges"></div>

<script src="game-theme.js"></script>
<script>
(function(){
  var creeperIcon = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="2" width="2" height="2" fill="#0b0c10"/><rect x="5" y="2" width="2" height="2" fill="#0b0c10"/><rect x="3" y="3" width="2" height="1" fill="#0b0c10"/><rect x="2" y="4" width="1" height="2" fill="#0b0c10"/><rect x="5" y="4" width="1" height="2" fill="#0b0c10"/><rect x="3" y="4" width="2" height="2" fill="#0b0c10"/></svg>';
  var checkIcon = '<svg class="completion-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8.5L6.1 12L13.5 4" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function isDoneOf(g){ return g.type === 'count' ? g.count > 0 : g.done; }

  function render(games){
    var visible = games.filter(function(g){ return g.visible !== false; });
    var sorted = visible.slice().sort(function(a,b){ return Number(isDoneOf(a)) - Number(isDoneOf(b)); });

    var badgesEl = document.getElementById('badges');
    badgesEl.innerHTML = '';

    sorted.forEach(function(g){
      var badge = document.createElement('div');
      var themeClass = (window.GauntletTheme && window.GauntletTheme.classFor(g)) || 'generic';
      var isDone = isDoneOf(g);
      badge.className = 'badge ' + themeClass + (isDone ? ' done' : '');
      badge.style.background = g.color;
      badge.style.borderColor = 'color-mix(in srgb, ' + g.color + ' 65%, black)';
      badge.style.fontFamily = (window.GauntletTheme && window.GauntletTheme.fontFor(g)) || '';
      var logoUrl = window.GauntletTheme && window.GauntletTheme.logoFor(g);
      var useLogoMark = themeClass === 'lol' || themeClass === 'rocketleague';
      var mark = isDone
        ? checkIcon
        : (useLogoMark && logoUrl
          ? '<img src="' + logoUrl + '" alt="">'
          : (g.icon === 'creeper' ? creeperIcon : '<span>' + g.icon + '</span>'));
      var name = themeClass === 'minecraft' && logoUrl
        ? '<img class="game-wordmark" src="' + logoUrl + '" alt="Minecraft">'
        : '<span class="badge-name">' + g.name + '</span>';
      badge.innerHTML = '<span class="game-mark">' + mark + '</span>' + name;
      badgesEl.appendChild(badge);
    });
  }

  fetch('/gauntlet/api/state').then(function(r){ return r.json(); }).then(function(s){ render(s.games || []); }).catch(function(){});

  var events = new EventSource('/gauntlet/api/events');
  events.onmessage = function(event){
    try { render(JSON.parse(event.data).games || []); } catch(e){}
  };
})();
</script>
</body>
</html>
