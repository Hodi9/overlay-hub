<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Gauntlet Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  :root{ --check:#3fd67a; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Rajdhani',sans-serif;}

  .stack{
    display:flex;
    flex-direction:column;
    gap:22px;
    padding:20px;
    width:fit-content;
  }

  /* --- gauntlet badges --- */
  .badges{display:flex;gap:12px;flex-wrap:wrap;max-width:640px;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 18px 8px 8px;
    border-radius:999px;
    font-weight:700;
    font-size:1.1rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
    border:2px solid rgba(255,255,255,0.18);
    box-shadow:0 3px 0 rgba(0,0,0,0.35), 0 6px 14px rgba(0,0,0,0.3);
    transition:opacity .2s ease, filter .2s ease;
  }
  .badge.pending{opacity:0.4; filter:grayscale(0.6);}
  .badge-icon{
    width:24px;height:24px;border-radius:50%;
    background:rgba(0,0,0,0.28);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .badge-icon svg{width:14px;height:14px;}
  .badge-icon.count{font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:700;color:#fff;}

  /* --- death counter --- */
  .deaths{display:flex;flex-direction:column;gap:10px;}
  .death-card{
    display:flex;width:260px;border-radius:14px;overflow:hidden;
    background:#14161c;border:2px solid rgba(255,255,255,0.1);
    box-shadow:0 4px 0 rgba(0,0,0,0.35), 0 8px 16px rgba(0,0,0,0.3);
  }
  .death-icon{
    width:58px;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:1.15rem;color:#fff;
  }
  .death-icon svg{width:30px;height:30px;}
  .death-body{flex:1;padding:8px 12px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0;}
  .death-label{font-weight:700;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;padding:2px 9px;border-radius:5px;color:#fff;}
  .death-number{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.8rem;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="stack">
  <div class="badges" id="badges"></div>
  <div class="deaths" id="deaths"></div>
</div>

<script>
(function(){
  var checkIcon = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var creeperIcon = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges">' +
    '<rect x="1" y="2" width="2" height="2" fill="#0b0c10"/>' +
    '<rect x="5" y="2" width="2" height="2" fill="#0b0c10"/>' +
    '<rect x="3" y="3" width="2" height="1" fill="#0b0c10"/>' +
    '<rect x="2" y="4" width="1" height="2" fill="#0b0c10"/>' +
    '<rect x="5" y="4" width="1" height="2" fill="#0b0c10"/>' +
    '<rect x="3" y="4" width="2" height="2" fill="#0b0c10"/>' +
    '</svg>';

  function isDoneOf(g){ return g.type === 'count' ? g.count > 0 : g.done; }

  function render(games){
    var sorted = games.slice().sort(function(a,b){ return Number(isDoneOf(a)) - Number(isDoneOf(b)); });

    var badgesEl = document.getElementById('badges');
    var deathsEl = document.getElementById('deaths');
    badgesEl.innerHTML = '';
    deathsEl.innerHTML = '';

    sorted.forEach(function(g){
      var isDone = isDoneOf(g);

      var badge = document.createElement('div');
      badge.className = 'badge' + (isDone ? '' : ' pending');
      badge.style.background = g.color;
      badge.style.borderColor = 'color-mix(in srgb, ' + g.color + ' 65%, black)';
      var icon = g.type === 'check'
        ? '<span class="badge-icon">' + checkIcon + '</span>'
        : '<span class="badge-icon count">' + g.count + '</span>';
      badge.innerHTML = icon + '<span>' + g.name + '</span>';
      badgesEl.appendChild(badge);

      var card = document.createElement('div');
      card.className = 'death-card';
      var iconHtml = g.icon === 'creeper' ? creeperIcon : ('<span>' + g.icon + '</span>');
      card.innerHTML =
        '<div class="death-icon" style="background:' + g.color + '">' + iconHtml + '</div>' +
        '<div class="death-body">' +
          '<span class="death-label" style="background:' + g.color + '">Deaths</span>' +
          '<span class="death-number">' + (g.deaths || 0) + '</span>' +
        '</div>';
      deathsEl.appendChild(card);
    });
  }

  fetch('/gauntlet/api/state').then(function(r){ return r.json(); }).then(function(s){ render(s.games || []); }).catch(function(){});

  var events = new EventSource('/gauntlet/api/events');
  events.onmessage = function(event){
    try { render(JSON.parse(event.data).games || []); } catch(e){}
  };
})();
</script>
</body>
</html>
