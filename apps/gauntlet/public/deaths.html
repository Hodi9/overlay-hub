<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Gauntlet Death Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Press+Start+2P&family=Black+Ops+One&family=Cinzel:wght@600;700&family=Bebas+Neue&family=Bungee&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Rajdhani',sans-serif;}

  .deaths{display:flex;flex-direction:column;gap:7px;padding:20px;width:fit-content;}
  .death-card{
    --game:#278adf;display:grid;grid-template-columns:54px 88px;width:142px;height:56px;border-radius:11px;overflow:hidden;
    background:#050609;border:3px solid rgba(8,10,14,.9);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 rgba(0,0,0,.48),0 6px 10px rgba(0,0,0,.25);
  }
  .death-icon{
    width:54px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:1.35rem;color:#fff;border-right:3px solid rgba(0,0,0,.3);
    background:var(--game);
    text-shadow:0 2px 0 rgba(0,0,0,.42);
  }
  .death-icon svg{width:36px;height:36px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));}
  .death-body{display:grid;grid-template-rows:20px 1fr;min-width:0;background:#050609;}
  .death-label{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.69rem;text-transform:none;letter-spacing:.03em;color:#fff;background:var(--game);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .death-number{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:1.72rem;color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000;}
  .death-card.fortnite .death-icon{background:#38a8ef;}
  .death-card.warzone .death-icon{background:#f0ad00;color:#111;text-shadow:none;}
  .death-card.minecraft .death-icon{background:#45c43d;}
  .death-card.minecraft .death-icon svg{width:39px;height:39px;}
  .death-card.fortnite .death-icon{font-size:1.55rem;}
  .death-card.warzone .death-icon{font-size:1.12rem;letter-spacing:-.08em;}
</style>
</head>
<body>
<div class="deaths" id="deaths"></div>

<script src="game-theme.js"></script>
<script>
(function(){
  var creeperIcon = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges">' +
    '<rect x="1" y="2" width="2" height="2" fill="#0b0c10"/>' +
    '<rect x="5" y="2" width="2" height="2" fill="#0b0c10"/>' +
    '<rect x="3" y="3" width="2" height="1" fill="#0b0c10"/>' +
    '<rect x="2" y="4" width="1" height="2" fill="#0b0c10"/>' +
    '<rect x="5" y="4" width="1" height="2" fill="#0b0c10"/>' +
    '<rect x="3" y="4" width="2" height="2" fill="#0b0c10"/>' +
    '</svg>';

  function isDoneOf(g){ return g.type === 'count' ? g.count > 0 : g.done; }

  function render(games){
    var visible = games.filter(function(g){ return g.visible !== false; });
    var sorted = visible.slice().sort(function(a,b){ return Number(isDoneOf(a)) - Number(isDoneOf(b)); });

    var deathsEl = document.getElementById('deaths');
    deathsEl.innerHTML = '';

    sorted.forEach(function(g){
      var card = document.createElement('div');
      var themeClass = (window.GauntletTheme && window.GauntletTheme.classFor(g)) || 'generic';
      card.className = 'death-card ' + themeClass;
      card.style.setProperty('--game', g.color);
      var font = (window.GauntletTheme && window.GauntletTheme.fontFor(g)) || '';
      var iconStyle = font ? ' style="font-family:' + font + '"' : '';
      var iconHtml = g.icon === 'creeper' ? creeperIcon : ('<span' + iconStyle + '>' + g.icon + '</span>');
      card.innerHTML =
        '<div class="death-icon">' + iconHtml + '</div>' +
        '<div class="death-body">' +
          '<span class="death-label">Deaths</span>' +
          '<span class="death-number">' + (g.deaths || 0) + '</span>' +
        '</div>';
      deathsEl.appendChild(card);
    });
  }

  fetch('/gauntlet/api/state').then(function(r){ return r.json(); }).then(function(s){ render(s.games || []); }).catch(function(){});

  var events = new EventSource('/gauntlet/api/events');
  events.onmessage = function(event){
    try { render(JSON.parse(event.data).games || []); } catch(e){}
  };
})();
</script>
</body>
</html>
