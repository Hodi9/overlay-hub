<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subathon — Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Instrument+Serif&display=swap">
<style>
  :root {
    --display: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Schibsted Grotesk", system-ui, sans-serif;
    /* The default theme (Dreamglow: the front page's dark mint ground, lime and green). The overlay sets these from the chosen
       theme in looks.js; --a1/--a2 are the two accents, --tint/--base the cards' ground, --line their edge, --alpha how solid they are. */
    --alpha: .66;
    --tint: 25, 41, 35;
    --base: 8, 11, 10;
    --ink: #f3f5f1;
    --muted: #aab4ae;
    --a1: #c9f36b;
    --a2: #72c99b;
    --on: #0b0b0d;
    --line: 114, 201, 155;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body.bg-preview { background: #141414; }

  .stack { display: flex; flex-direction: column; gap: 10px; width: 560px; margin: 24px; font-family: var(--sans); color: var(--ink); opacity: 0; transition: opacity .4s; }
  .stack.ready { opacity: 1; }
  body.only-timer #goal-card, body.only-goal #timer-card { display: none; }

  .card {
    position: relative; overflow: hidden; padding: 20px 26px 22px;
    background: linear-gradient(155deg, rgba(var(--tint), var(--alpha)) 0%, rgba(var(--base), var(--alpha)) 75%);
    border: 1px solid rgba(var(--line), .32); border-radius: 3px;
  }
  /* A thin line of the logo's lime-to-green along the top; it is drawn again, left to right, whenever something happens. */
  .card::before, .card::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--a1), var(--a2)); }
  .card::before { opacity: .55; }
  .card::after { transform: scaleX(0); transform-origin: 0 50%; }
  .card.hit::after { animation: sweep 1.1s cubic-bezier(.2, .8, .2, 1); }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .head > .label:first-child { color: var(--a2); }
  .state { display: inline-flex; align-items: center; gap: 8px; }
  .state::before { content: ""; width: 7px; height: 7px; background: var(--muted); }
  .state.running { color: var(--ink); }
  .state.running::before { background: var(--a1); }

  /* Fixed-width cells for the digits, so the clock does not jitter when 1 turns into 0. */
  .clock {
    display: flex; width: max-content; margin: 6px 0 4px -4px; font-family: var(--display); font-size: 132px; line-height: 1.02; white-space: nowrap;
    color: transparent; background: linear-gradient(100deg, var(--a1) 30%, var(--a2) 100%); -webkit-background-clip: text; background-clip: text;
  }
  .clock .d { display: inline-block; width: .5em; text-align: center; }
  .clock .c { display: inline-block; width: .26em; text-align: center; opacity: .6; }
  .clock.idle, .clock.paused { opacity: .55; }
  .clock.ended { background: none; color: var(--muted); }
  .clock.lift { animation: lift 1s ease-out; }

  /* The "added so far" line and the line that announces a new sub share one cell and trade places. */
  .foot { display: grid; align-items: center; min-height: 28px; }
  .foot > * { grid-area: 1 / 1; transition: opacity .3s; }
  .added { display: flex; gap: 10px; align-items: baseline; }
  .added b { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--a1); letter-spacing: .02em; }
  .ping { display: flex; align-items: baseline; gap: 12px; min-width: 0; opacity: 0; }
  .ping .plus { flex: none; font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--a1); }
  .ping .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; }
  .foot.alert .ping { opacity: 1; }
  .foot.alert .added { opacity: 0; }

  .goals-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 10px 0 14px; }
  .count { font-family: var(--display); font-size: 76px; line-height: .95; display: inline-block; transform-origin: 0 100%; }
  .count.bump { animation: bump .5s ease-out; }
  .of { font-family: var(--display); font-size: 38px; color: var(--a2); margin-left: 8px; }
  .next { text-align: right; min-width: 0; padding-bottom: 6px; }
  .next .title { margin-top: 4px; font-size: 20px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
  .bar { height: 4px; background: rgba(255, 255, 255, .13); }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2)); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 9px; }
  .list li { display: grid; grid-template-columns: 16px 58px 1fr; align-items: center; gap: 12px; color: var(--muted); font-size: 17px; }
  .list li.next-up { color: var(--ink); }
  .list .box { width: 14px; height: 14px; border: 1px solid rgba(255, 255, 255, .38); position: relative; }
  .list li.next-up .box { border-color: var(--a1); }
  .list li.done .box { background: var(--a1); border-color: var(--a1); }
  .list li.done .box::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--on); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .list .target { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; }
  .list li.next-up .target { color: var(--a1); }
  .list .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { margin: 10px 0 0 28px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .reached { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 26px; background: linear-gradient(100deg, var(--a1), var(--a2)); color: var(--on); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .reached.show { opacity: 1; }
  .reached .label { color: var(--on); opacity: .7; }
  .reached .title { font-family: var(--display); font-size: 44px; line-height: 1.05; overflow-wrap: anywhere; }

  [hidden] { display: none !important; }
  @keyframes bump { 0% { transform: scale(1); color: var(--a1); } 30% { transform: scale(1.14); color: var(--a1); } 100% { transform: scale(1); } }
  @keyframes sweep { 0% { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes lift { 0% { filter: brightness(1.55); } 100% { filter: brightness(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stack" id="stack">
  <section class="card" id="timer-card">
    <div class="head"><span class="label">Subathon</span><span class="label state" id="state">Not started</span></div>
    <div class="clock idle" id="clock" aria-live="off"></div>
    <div class="foot" id="foot">
      <div class="added"><span class="label">Added so far</span><b id="added">+0:00</b></div>
      <div class="ping"><span class="plus" id="ping-plus"></span><span class="who" id="ping-who"></span></div>
    </div>
  </section>

  <section class="card" id="goal-card">
    <div class="head"><span class="label">Subs</span><span class="label" id="next-label">Next goal</span></div>
    <div class="goals-top">
      <div><span class="count" id="count">0</span><span class="of" id="of" hidden></span></div>
      <div class="next"><div class="title" id="next-title"></div></div>
    </div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <ul class="list" id="list"></ul>
    <div class="more" id="more" hidden></div>
    <div class="reached" id="reached"><span class="label">Goal reached</span><span class="title" id="reached-title"></span></div>
  </section>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('bg') === 'black') document.body.classList.add('bg-preview');
  var view = params.get('view');
  if (view === 'timer') document.body.classList.add('only-timer');
  if (view === 'goal') document.body.classList.add('only-goal');

  var $ = function (id) { return document.getElementById(id); };
  var clock = $('clock'), stateEl = $('state'), addedEl = $('added'), foot = $('foot');
  var countEl = $('count'), ofEl = $('of'), fill = $('fill'), list = $('list');

  var STATE_LABELS = { idle: 'Not started', running: 'Running', paused: 'Paused', ended: 'Ended' };
  var base = null;        // { status, remainingMs, at } from the last state, `at` is performance.now()
  var shownText = null;
  var lastEventId;        // undefined until the first state has arrived
  var lastCount = null;
  var lastReached = null; // ids of the goals that were reached in the last state
  var pingTimer = 0, reachedTimer = 0;

  // The colour theme and card opacity come from the panel; ?look=<key> and ?opacity=<0..1> in the address win over it.
  var looks = null;
  function applyLook(settings) {
    if (!looks) return;
    var wanted = params.get('look');
    var look = looks.lookByKey(looks.LOOKS.some(function (l) { return l.key === wanted; }) ? wanted : settings.look);
    var root = document.documentElement.style;
    root.setProperty('--a1', look.a1); root.setProperty('--a2', look.a2);
    root.setProperty('--tint', look.tint); root.setProperty('--base', look.base);
    root.setProperty('--line', look.line); root.setProperty('--ink', look.ink);
    root.setProperty('--muted', look.muted); root.setProperty('--on', look.on);
    var alpha = parseFloat(params.get('opacity'));
    if (!(alpha >= 0 && alpha <= 1)) alpha = settings.opacity;
    if (alpha >= 0 && alpha <= 1) root.setProperty('--alpha', alpha);
  }

  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function formatClock(totalSeconds) {
    var h = Math.floor(totalSeconds / 3600), m = Math.floor(totalSeconds / 60) % 60, s = totalSeconds % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }
  function formatDelta(ms) {
    var total = Math.round(Math.abs(ms) / 1000);
    var h = Math.floor(total / 3600), m = Math.floor(total / 60) % 60, s = total % 60;
    return (ms < 0 ? '−' : '+') + (h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s));
  }

  function renderClock(text, status) {
    if (text !== shownText) {
      shownText = text;
      var html = '', digits = 0, colons = 0;
      for (var i = 0; i < text.length; i++) {
        if (text[i] === ':') { html += '<span class="c">:</span>'; colons++; }
        else { html += '<span class="d">' + text[i] + '</span>'; digits++; }
      }
      clock.innerHTML = html;
      // Long timers (100+ hours) shrink to stay inside the card.
      clock.style.fontSize = Math.min(132, Math.floor(500 / (digits * 0.5 + colons * 0.26))) + 'px';
    }
    clock.className = 'clock ' + status;
  }

  function currentRemaining() {
    if (!base) return 0;
    if (base.status !== 'running') return base.remainingMs;
    return Math.max(0, base.remainingMs - (performance.now() - base.at));
  }

  function tick() {
    if (!base) return;
    var remaining = currentRemaining();
    var status = base.status === 'running' && remaining <= 0 ? 'ended' : base.status;
    renderClock(formatClock(Math.ceil(remaining / 1000)), status);
    stateEl.textContent = STATE_LABELS[status] || status;
    stateEl.className = 'label state ' + status;
  }

  var VERBS = { sub: 'subscribed', resub: 'resubscribed', subgift: 'gifted a sub', submysterygift: 'gifted subs' };
  function describe(entry) {
    var text;
    if (entry.kind === 'subgift') text = entry.user + ' gifted a sub' + (entry.recipient ? ' to ' + entry.recipient : '');
    else if (entry.kind === 'submysterygift') text = entry.user + ' gifted ' + entry.count + (entry.count === 1 ? ' sub' : ' subs');
    else text = entry.user + ' ' + (VERBS[entry.kind] || 'subscribed');
    return text + (entry.tier > 1 ? ' · Tier ' + entry.tier : '');
  }

  function announce(entry) {
    $('ping-plus').textContent = entry.addedMs ? formatDelta(entry.addedMs) : '';
    $('ping-who').textContent = describe(entry);
    foot.classList.add('alert');
    replay($('timer-card'), 'hit');
    replay(clock, 'lift');
    clearTimeout(pingTimer);
    pingTimer = setTimeout(function () { foot.classList.remove('alert'); }, 6500);
  }

  function renderGoals(state) {
    var goals = state.goals || [];
    var next = null;
    for (var i = 0; i < goals.length; i++) if (!goals[i].reached) { next = goals[i]; break; }

    countEl.textContent = state.count;
    if (lastCount !== null && state.count > lastCount) {
      replay(countEl, 'bump');
      replay($('goal-card'), 'hit');
    }
    lastCount = state.count;

    $('bar').hidden = !goals.length;
    $('next-label').textContent = !goals.length ? '' : next ? 'Next goal' : 'All goals reached';
    $('next-title').textContent = next ? next.title : '';
    ofEl.hidden = !next;
    if (next) ofEl.textContent = '/ ' + next.target;
    fill.style.width = (goals.length ? (next ? Math.min(100, state.count / next.target * 100) : 100) : 0) + '%';

    var reached = goals.filter(function (g) { return g.reached; });
    var upcoming = goals.filter(function (g) { return !g.reached; });
    var shown = reached.slice(-1).concat(upcoming.slice(0, 4));
    list.textContent = '';
    shown.forEach(function (goal) {
      var li = document.createElement('li');
      li.className = goal.reached ? 'done' : goal === next ? 'next-up' : '';
      var box = document.createElement('span'); box.className = 'box';
      var target = document.createElement('span'); target.className = 'target'; target.textContent = goal.target;
      var name = document.createElement('span'); name.className = 'name'; name.textContent = goal.title;
      li.appendChild(box); li.appendChild(target); li.appendChild(name);
      list.appendChild(li);
    });
    var hidden = goals.length - shown.length;
    $('more').hidden = hidden <= 0;
    $('more').textContent = '+ ' + hidden + ' more';

    var ids = reached.map(function (g) { return g.id; });
    if (lastReached) {
      var fresh = reached.filter(function (g) { return lastReached.indexOf(g.id) < 0; });
      if (fresh.length) {
        $('reached-title').textContent = fresh[fresh.length - 1].title;
        $('reached').classList.add('show');
        clearTimeout(reachedTimer);
        reachedTimer = setTimeout(function () { $('reached').classList.remove('show'); }, 8000);
      }
    }
    lastReached = ids;
  }

  function render(state) {
    applyLook(state.settings || {});
    base = { status: state.timer.status, remainingMs: state.timer.remainingMs, at: performance.now() };
    addedEl.textContent = (state.timer.addedMs < 0 ? '−' : '+') + formatClock(Math.round(Math.abs(state.timer.addedMs) / 1000));
    tick();
    renderGoals(state);

    var events = state.events || [];
    if (lastEventId !== undefined && events.length && events[0].id !== lastEventId) announce(events[0]);
    lastEventId = events.length ? events[0].id : null;
    $('stack').classList.add('ready');
  }

  function load() {
    fetch('/subathon/api/state').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { if (s) render(s); }).catch(function () {});
  }
  // The themes are loaded first, so the overlay never shows up in the wrong colours.
  import('./looks.js').then(function (module) { looks = module; }, function () { /* keep the default colours */ }).then(function () {
    load();
    setInterval(load, 30000); // in case the live connection has gone quiet
    setInterval(tick, 200);
    var events = new EventSource('/subathon/api/events');
    events.onmessage = function (event) { try { render(JSON.parse(event.data)); } catch (e) {} };
  });
})();
</script>
</body>
</html>
