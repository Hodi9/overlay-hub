<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon TV Live — Kontrolpanel</title>
<style>
  :root{color-scheme:dark;--accent:#ef233c;--bg:#070a10;--panel:#0e1420;--panel2:#151d2a;--line:rgba(255,255,255,.1);--muted:#8490a4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#182336 0,#080c13 42%,#05070b 100%);color:#f8fafc}.app{min-height:100vh;display:grid;grid-template-columns:minmax(300px,390px) 1fr}.panel{padding:28px 26px;background:linear-gradient(180deg,#0e1420,#080b11);border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.eyebrow{margin:0 0 5px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:1.08rem}.live{color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.12em}.live::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
  .lock{padding:15px;background:#121925;border:1px solid var(--line);border-radius:10px;margin-bottom:22px}.lock-row{display:flex;gap:8px}.lock p{margin:0 0 10px;color:var(--muted);font-size:.78rem}.status{min-height:18px;margin:8px 0 0;font-size:.76rem;color:var(--muted)}.status.ok{color:#65d6a2}.status.error{color:#ff7386}
  fieldset{border:0;padding:0;margin:0;min-width:0}fieldset[disabled]{opacity:.42;pointer-events:none}.section{border-top:1px solid var(--line);padding-top:19px;margin-top:19px}.section h2{margin:0 0 13px;color:#c5ccd9;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase}label{display:block;margin:12px 0 6px;color:#abb4c4;font-size:.78rem;font-weight:700}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:10px 11px;color:#fff;background:var(--panel2);border:1px solid var(--line);border-radius:8px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}textarea{min-height:92px;resize:vertical;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0}.switch{width:44px;height:24px;padding:0;border:0;border-radius:99px;background:#263044;position:relative}.switch::after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.18s}.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{transform:translateX(20px)}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{height:32px;border:2px solid transparent;border-radius:8px;background:var(--swatch)}.swatch[aria-pressed="true"]{border-color:#fff}.save{width:100%;margin-top:20px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:850;cursor:pointer}
  .preview{padding:24px;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.preview h2{margin:0;font-size:1.45rem}.preview a{color:#9ba8bb;font-size:.78rem}.screen{flex:1;min-height:520px;border:1px solid rgba(255,255,255,.14);border-radius:13px;overflow:hidden;background:#111a28;box-shadow:0 28px 70px rgba(0,0,0,.45)}iframe{width:100%;height:100%;min-height:520px;border:0;background:linear-gradient(135deg,#253248,#0f1724 45%,#070b11)}
  @media(max-width:900px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line)}.preview{min-height:600px}}@media(max-width:520px){.panel,.preview{padding:20px 16px}.row{grid-template-columns:1fr}.lock-row{display:block}.lock-row button{width:100%;margin-top:8px}}
</style>
</head>
<body><main class="app"><aside class="panel"><div class="brand"><div><p class="eyebrow">Broadcast control</p><h1>Moon TV Live</h1></div><span class="live">LIVE</span></div>
<div class="lock"><p>Indtast adgangskoden for at låse kontrollen op.</p><div class="lock-row"><input id="password" type="password" placeholder="Adgangskode" autocomplete="current-password"><button id="unlock" class="save" style="width:auto;margin:0">Lås op</button></div><div id="auth-status" class="status"></div></div>
<fieldset id="controls" disabled><section class="section"><h2>Breaking bar</h2><label for="label">Label</label><input id="label" maxlength="24"><label for="headline">Overskrift</label><input id="headline" maxlength="68"><div class="row"><div><label for="station">Kanalnavn</label><input id="station" maxlength="16"></div><div><label for="speed">Ticker-hastighed</label><select id="speed"><option value="44">Rolig</option><option value="34">Normal</option><option value="24">Hurtig</option></select></div></div></section>
<section class="section"><h2>Informationsrulle</h2><label for="ticker">Én besked pr. linje</label><textarea id="ticker"></textarea></section>
<section class="section"><h2>Udtryk</h2><label>Signal-farve</label><div class="swatches"><button class="swatch" style="--swatch:#ef233c" data-color="#ef233c" aria-label="Rød"></button><button class="swatch" style="--swatch:#1769e0" data-color="#1769e0" aria-label="Blå"></button><button class="swatch" style="--swatch:#f0a202" data-color="#f0a202" aria-label="Gul"></button><button class="swatch" style="--swatch:#00a896" data-color="#00a896" aria-label="Grøn"></button></div><div class="switch-row"><span>Vis ur</span><button id="showClock" class="switch" type="button" role="switch" aria-checked="true"></button></div><div class="switch-row"><span>Sæt ticker på pause</span><button id="paused" class="switch" type="button" role="switch" aria-checked="false"></button></div></section><button id="save" class="save" type="button">Gem og send live</button><div id="save-status" class="status"></div></fieldset></aside>
<section class="preview"><div class="preview-head"><div><p class="eyebrow">Program preview</p><h2>Live udsendelse</h2></div><a href="/moontv/" target="_blank">Åbn overlay ↗</a></div><div class="screen"><iframe src="/moontv/?bg=black" title="Moon TV overlay preview"></iframe></div></section></main>
<script>
(function(){
  var keyName='moontv-control-password',state=null,els={};['password','unlock','auth-status','controls','label','headline','station','speed','ticker','showClock','paused','save','save-status'].forEach(function(id){els[id]=document.getElementById(id)});
  function password(){try{return localStorage.getItem(keyName)||''}catch(e){return''}}function headers(){return{'Content-Type':'application/json','x-moontv-key':password()}}function message(el,text,kind){el.textContent=text;el.className='status '+(kind||'')}
  function render(s){state=s;els.label.value=s.label;els.headline.value=s.headline;els.station.value=s.station;els.speed.value=String(s.speed);els.ticker.value=(s.ticker||[]).join('\n');els.showClock.setAttribute('aria-checked',s.showClock);els.paused.setAttribute('aria-checked',s.paused);document.documentElement.style.setProperty('--accent',s.color);document.querySelectorAll('.swatch').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.color===s.color)})}
  function unlock(){var entered=els.password.value.trim();try{localStorage.setItem(keyName,entered)}catch(e){}fetch('/moontv/api/auth',{method:'POST',headers:headers()}).then(function(r){if(!r.ok)throw new Error();els.controls.disabled=false;message(els['auth-status'],'Kontrolpanelet er låst op.','ok')}).catch(function(){els.controls.disabled=true;message(els['auth-status'],'Forkert adgangskode.','error')})}
  els.unlock.addEventListener('click',unlock);els.password.addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});els.password.value=password();
  ['showClock','paused'].forEach(function(id){els[id].addEventListener('click',function(){this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')})});
  document.querySelectorAll('.swatch').forEach(function(b){b.addEventListener('click',function(){state.color=b.dataset.color;document.querySelectorAll('.swatch').forEach(function(x){x.setAttribute('aria-pressed',x===b)});document.documentElement.style.setProperty('--accent',b.dataset.color)})});
  els.save.addEventListener('click',function(){var next={label:els.label.value,headline:els.headline.value,station:els.station.value,speed:Number(els.speed.value),ticker:els.ticker.value.split('\n'),color:state.color,showClock:els.showClock.getAttribute('aria-checked')==='true',paused:els.paused.getAttribute('aria-checked')==='true'};fetch('/moontv/api/state',{method:'PUT',headers:headers(),body:JSON.stringify(next)}).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(s){render(s);message(els['save-status'],'Overlayet er opdateret.','ok')}).catch(function(){message(els['save-status'],'Kunne ikke gemme — kontrollér adgangskoden.','error')})});
  fetch('/moontv/api/state').then(function(r){return r.json()}).then(function(s){render(s);if(password())unlock()});
})();
</script></body></html>
