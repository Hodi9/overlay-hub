<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon TV Live — Overlay</title>
<style>
  :root{--accent:#ef233c;--accent-dark:#9f1023;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff}
  body.black{background:#101722}
  .lower-third{position:absolute;left:2.5%;right:2.5%;bottom:3.5%;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55))}
  .network-rail{width:max-content;height:34px;display:flex;align-items:stretch;margin:0 18px 0 14px;background:linear-gradient(90deg,rgba(7,12,20,.98),rgba(13,21,34,.94));border-top:1px solid rgba(255,255,255,.2);clip-path:polygon(8px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
  .network-logo{min-width:210px;display:flex;align-items:center;gap:10px;padding:0 28px 0 18px;background:linear-gradient(120deg,#080d16 0%,#121b2a 88%,var(--accent) 88%)}
  .network-name{font-size:.8rem;font-weight:950;font-style:italic;letter-spacing:.065em;text-transform:uppercase}.network-live{color:var(--accent);font-size:.7rem;font-weight:1000;letter-spacing:.15em}
  .headline-row{height:84px;display:grid;grid-template-columns:minmax(200px,24%) 1fr;align-items:stretch;position:relative}.headline-row::after{content:"";position:absolute;inset:0;pointer-events:none;border-top:1px solid rgba(255,255,255,.6);border-bottom:1px solid rgba(0,0,0,.55)}
  .breaking{min-width:200px;padding:0 26px;display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,white),var(--accent-dark));text-transform:uppercase;font-size:clamp(.92rem,1.5vw,1.25rem);font-style:italic;font-weight:1000;letter-spacing:.075em;clip-path:polygon(0 0,100% 0,calc(100% - 27px) 100%,0 100%);box-shadow:inset 0 0 25px rgba(255,255,255,.08)}
  .breaking::before{content:"";width:8px;height:37px;flex:0 0 auto;background:#fff;transform:skewX(-15deg);box-shadow:0 0 14px rgba(255,255,255,.4)}
  .headline{margin-left:-27px;padding:0 38px 0 52px;display:flex;align-items:center;min-width:0;background:linear-gradient(105deg,rgba(255,255,255,.99),rgba(222,227,234,.98) 58%,rgba(194,202,213,.98));color:#080b10;font-size:clamp(1.12rem,2.05vw,1.92rem);font-weight:1000;font-style:italic;letter-spacing:-.03em;text-transform:uppercase;clip-path:polygon(27px 0,100% 0,calc(100% - 25px) 100%,0 100%);text-shadow:0 1px 0 #fff}.headline span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ticker-row{height:42px;display:grid;grid-template-columns:auto 1fr auto;overflow:hidden;background:rgba(5,9,15,.97);border-top:1px solid rgba(255,255,255,.16);border-bottom:3px solid var(--accent)}
  .ticker-label{display:flex;align-items:center;padding:0 21px;background:#f4f6f8;color:#090c11;font-size:.74rem;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.ticker-viewport{overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
  .ticker-track{width:max-content;white-space:nowrap;animation:ticker var(--speed,34s) linear infinite;font-size:.84rem;font-weight:760;letter-spacing:.035em}.ticker-track span::after{content:"◆";color:var(--accent);font-size:.58rem;margin:0 24px}.clock{min-width:92px;display:flex;align-items:center;justify-content:center;background:#0d1521;border-left:1px solid rgba(255,255,255,.1);font:850 .8rem ui-monospace,monospace}
  @keyframes ticker{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.ticker-track{animation:none}}
  @media(max-width:560px){.lower-third{left:2%;right:2%;bottom:2%}.network-rail{height:30px;margin:0 8px;max-width:205px}.network-logo{min-width:0;padding:0 18px 0 13px}.headline-row{height:auto;display:block}.breaking{min-width:0;height:34px;padding:0 14px;clip-path:none}.breaking::before{width:5px;height:19px}.headline{margin:0;min-height:55px;padding:0 15px;clip-path:none}.ticker-row{height:39px;grid-template-columns:auto 1fr}.clock{display:none}}
</style>
</head>
<body>
<div class="lower-third">
  <div class="network-rail"><div class="network-logo"><span id="station" class="network-name">MOON TV</span><span class="network-live">LIVE</span></div></div>
  <div class="headline-row"><div class="breaking"><span id="label">BREAKING</span></div><div class="headline"><span id="headline">MOON TV LIVE FRA BEGIVENHEDERNES CENTRUM</span></div></div>
  <div class="ticker-row"><div class="ticker-label">Seneste</div><div class="ticker-viewport"><div id="ticker" class="ticker-track"></div></div><time id="clock" class="clock">--:--:--</time></div>
</div>
<script>
(function(){
  if(new URLSearchParams(location.search).get('bg')==='black')document.body.classList.add('black');
  function render(s){
    document.documentElement.style.setProperty('--accent',s.color);document.documentElement.style.setProperty('--accent-dark',s.dark);
    document.getElementById('label').textContent=s.label;document.getElementById('headline').textContent=s.headline;document.getElementById('station').textContent=s.station;
    var ticker=document.getElementById('ticker'),items=(s.ticker&&s.ticker.length?s.ticker:['Seneste nyt']);ticker.replaceChildren();
    items.concat(items).forEach(function(text){var span=document.createElement('span');span.textContent=text;ticker.appendChild(span)});
    ticker.style.setProperty('--speed',(s.speed||34)+'s');ticker.style.animationPlayState=s.paused?'paused':'running';document.getElementById('clock').hidden=!s.showClock;
  }
  function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('da-DK',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}setInterval(clock,1000);clock();
  fetch('/moontv/api/state').then(function(r){return r.json()}).then(render).catch(function(){});
  var events=new EventSource('/moontv/api/events');events.onmessage=function(event){try{render(JSON.parse(event.data))}catch(e){}};
})();
</script>
</body>
</html>
