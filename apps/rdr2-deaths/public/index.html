<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDR2 — Dødstæller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-start; justify-content: flex-start; height: 100vh; font-family: 'Cinzel', serif; }
  body.bg-preview { background: #141414; }

  .banner {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin: 30px;
    padding: 16px 56px 18px;
    border: 9px solid #0c0705;
    clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
    background:
      linear-gradient(90deg, rgba(12,5,3,.94), rgba(74,26,14,.58) 46%, rgba(10,4,2,.92)),
      linear-gradient(0deg, rgba(6,2,1,.55), rgba(0,0,0,0) 62%);
    box-shadow:
      0 10px 20px rgba(0,0,0,.6),
      inset 0 0 24px rgba(0,0,0,.7),
      inset 0 2px 0 rgba(232,195,122,.32),
      inset 0 -2px 0 rgba(232,195,122,.32);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .banner.ready { opacity: 1; transform: translateY(0); }
  .banner.pulse .value { animation: flash 520ms ease; }

  .label {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #e9d59a;
    text-shadow: 0 2px 1px #000, 0 0 9px rgba(227,179,77,.32);
    white-space: nowrap;
  }
  .value {
    font-size: 36px;
    font-weight: 700;
    color: #f3d98e;
    text-shadow: 0 2px 1px #000, 0 0 9px rgba(227,179,77,.4);
    font-variant-numeric: tabular-nums;
  }

  @keyframes flash {
    0% { text-shadow: 0 2px 1px #000, 0 0 9px rgba(227,179,77,.4); }
    35% { text-shadow: 0 2px 1px #000, 0 0 22px rgba(255,90,60,.85), 0 0 34px rgba(255,90,60,.5); color: #ffb27a; }
    100% { text-shadow: 0 2px 1px #000, 0 0 9px rgba(227,179,77,.4); }
  }
</style>
</head>
<body>
<div class="banner" id="banner">
  <span class="label">Dødsfald:</span>
  <span class="value" id="count">0</span>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('bg') === 'black') document.body.classList.add('bg-preview');

  var banner = document.getElementById('banner');
  var countEl = document.getElementById('count');
  var lastCount = null;

  function render(state){
    banner.classList.add('ready');
    var count = typeof state.count === 'number' ? state.count : 0;
    if (lastCount !== null && count > lastCount) {
      banner.classList.remove('pulse');
      void banner.offsetWidth;
      banner.classList.add('pulse');
    }
    lastCount = count;
    countEl.textContent = count;
  }

  function start(channel){
    var qs = '?channel=' + encodeURIComponent(channel);
    fetch('/rdr2-deaths/api/state' + qs).then(function(r){ return r.json(); }).then(render).catch(function(){});
    var events = new EventSource('/rdr2-deaths/api/events' + qs);
    events.onmessage = function(event){
      try { render(JSON.parse(event.data)); } catch(e){}
    };
  }

  var channel = params.get('channel');
  if (channel) {
    start(channel);
  } else {
    fetch('/rdr2-deaths/api/default-channel').then(function(r){ return r.json(); }).then(function(d){
      if (d.channel) start(d.channel);
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
