<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA IRL Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{ --accent:#ff5fa2; --scale:1; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Oswald',sans-serif;display:flex;align-items:flex-start;justify-content:flex-start;height:100vh;padding:40px;color:#fff;}
  body.bg-preview{background:#5d6b74 linear-gradient(160deg,#8aa0ad,#3c4850);}
  body.right{justify-content:flex-end;}
  body.bottom{align-items:flex-end;}

  /* IRL video is often bright, so the text sits on a soft dark backing instead of straight on the picture. */
  .card{position:relative;width:460px;padding:22px 24px 20px;background:linear-gradient(180deg,rgba(8,8,10,.72),rgba(8,8,10,.58));
    border-left:4px solid var(--accent);opacity:0;transform:scale(var(--scale));transform-origin:top left;transition:opacity .4s ease;}
  .card.ready{opacity:1;}
  .card.empty{display:none;}
  body.right .card{transform-origin:top right;}
  body.bottom .card{transform-origin:bottom left;}
  body.bottom.right .card{transform-origin:bottom right;}
  .card *{text-shadow:0 2px 8px rgba(0,0,0,.6);}

  .title{font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--accent);}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:2px;}
  .count{font-size:2.25rem;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .count small{font-size:1.1rem;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.75);margin-left:6px;}
  .percent{font-size:1.25rem;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;}

  .bar-rail{margin-top:10px;height:16px;width:100%;border-radius:3px;border:2px solid #fff;padding:3px;}
  .bar-fill{height:100%;border-radius:1px;background:var(--accent);width:0%;transition:width .7s ease;}

  .label{margin-top:18px;font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.7);}
  .label b{color:var(--accent);font-weight:600;}
  .now{margin-top:4px;display:flex;align-items:flex-start;gap:12px;font-size:2rem;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;}
  .now .bullet{flex:none;margin-top:.32em;width:12px;height:12px;transform:rotate(45deg);background:var(--accent);}
  .detail{margin-top:4px;padding-left:24px;font-size:1.05rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;line-height:1.2;color:rgba(255,255,255,.8);}
  .next .sub{display:block;font-size:.85rem;color:rgba(255,255,255,.6);letter-spacing:.08em;}
  .next{margin-top:4px;padding-left:24px;font-size:1.25rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;line-height:1.15;color:rgba(255,255,255,.88);}
  .done-msg{margin-top:16px;font-size:1.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);}

  /* The whole list (the panel's "Vis hele listen"). */
  .list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:7px;}
  .list li{display:grid;grid-template-columns:18px 1fr auto;align-items:baseline;gap:10px;font-size:1.15rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;line-height:1.15;color:rgba(255,255,255,.85);}
  .list .mark{width:9px;height:9px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.75);justify-self:center;align-self:center;}
  .list .sub{display:block;font-size:.72em;font-weight:500;letter-spacing:.08em;color:rgba(255,255,255,.6);text-decoration:none;}
  .list li.is-done .sub{display:none;}
  .list .kind{font-size:.75rem;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.55);}
  .list li.is-done{color:rgba(255,255,255,.45);}
  .list li.is-done .text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--accent);}
  .list li.is-done .mark{border-color:var(--accent);background:var(--accent);opacity:.7;}
  .list li.is-now{font-size:1.5rem;font-weight:700;color:#fff;}
  .list li.is-now .mark{width:12px;height:12px;border:none;background:var(--accent);}
  .list li.is-now .kind{color:var(--accent);}


  .card.align-right{text-align:right;border-left:none;border-right:4px solid var(--accent);}
  .card.align-right .head{flex-direction:row-reverse;}
  .card.align-right .now{flex-direction:row-reverse;}
  .card.align-right .next,.card.align-right .detail{padding-left:0;padding-right:24px;}
  .card.align-right .list li{grid-template-columns:auto 1fr 18px;}
  .card.align-right .list .kind{order:-1;}
  .card.align-right .list .mark{order:3;}
</style>
</head>
<body>
<div class="card" id="card">
  <div id="content"></div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('bg') === 'black' || params.get('bg') === 'preview') document.body.classList.add('bg-preview');
  var demo = params.has('demo');
  var card = document.getElementById('card');
  var content = document.getElementById('content');

  // Placement: ?corner=top-right / bottom-left / bottom-right (or ?side=right); the text follows the side.
  var corner = (params.get('corner') || '').toLowerCase();
  var right = params.get('side') === 'right' || /right/.test(corner);
  if (right) { document.body.classList.add('right'); card.classList.add('align-right'); }
  if (/bottom/.test(corner)) document.body.classList.add('bottom');

  var KIND = { mission: 'Mission', place: 'Location', activity: 'Activity' };
  // ?demo shows a made-up list when nothing has been typed in yet (it never touches the saved list).
  var DEMO = [
    { id: 'd1', kind: 'mission', text: 'Double or nothing', detail: 'Coin flip', done: true },
    { id: 'd2', kind: 'mission', text: 'The big heist', detail: 'Find the hidden prize', done: false },
    { id: 'd3', kind: 'place', text: 'Nyhavn', detail: '', done: false },
    { id: 'd4', kind: 'activity', text: 'Buy a hot dog', detail: '', done: false }
  ];

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // "Mission 2" for the second mission; places and activities just say what they are.
  function kindLabel(goals, goal){
    if (goal.kind !== 'mission') return KIND[goal.kind] || '';
    var n = 0, at = 0;
    goals.forEach(function(g){ if (g.kind === 'mission') { n++; if (g.id === goal.id) at = n; } });
    return 'Mission ' + at;
  }
  function sub(goal){ return goal.detail ? '<span class="sub">' + escapeHtml(goal.detail) + '</span>' : ''; }

  function summary(goals){
    var open = goals.filter(function(g){ return !g.done; });
    var done = goals.length - open.length;
    return { done: done, total: goals.length, percent: goals.length ? Math.round(done / goals.length * 1000) / 10 : 0,
      current: open[0] || null, next: open[1] || null, finished: goals.length > 0 && !open.length };
  }


  function render(state){
    var plan = state.plan || {};
    var goals = state.goals || [];
    if (!goals.length && demo) goals = DEMO;
    var p = goals === state.goals && state.progress ? state.progress : summary(goals);
    document.documentElement.style.setProperty('--scale', plan.scale || 1);
    card.classList.add('ready');
    card.classList.toggle('empty', !goals.length);
    if (!goals.length) { content.innerHTML = ''; return; }

    var html =
      '<div class="title">' + escapeHtml(plan.title || 'GTA IRL') + '</div>' +
      '<div class="head"><div class="count">' + p.done + ' / ' + p.total + '<small>' + (goals.every(function(g){ return g.kind === 'mission'; }) ? 'Missions' : 'Complete') + '</small></div>' +
      '<div class="percent">' + p.percent.toFixed(1) + '%</div></div>' +
      '<div class="bar-rail"><div class="bar-fill" style="width:' + p.percent + '%"></div></div>';

    if (plan.showAll) {
      html += '<ul class="list">' + goals.map(function(g){
        var cls = g.done ? 'is-done' : (p.current && g.id === p.current.id ? 'is-now' : '');
        return '<li class="' + cls + '"><span class="mark"></span><span class="text">' + escapeHtml(g.text) + sub(g) + '</span><span class="kind">' + kindLabel(goals, g) + '</span></li>';
      }).join('') + '</ul>';
      if (p.finished) html += '<div class="done-msg">All goals complete</div>';
    } else if (p.finished) {
      html += '<div class="done-msg">All goals complete</div>';
    } else {
      html += '<div class="label"><b>Current</b> · ' + kindLabel(goals, p.current) + '</div>' +
        '<div class="now"><span class="bullet"></span><span>' + escapeHtml(p.current.text) + '</span></div>' +
        (p.current.detail ? '<div class="detail">' + escapeHtml(p.current.detail) + '</div>' : '');
      if (p.next) html += '<div class="label">Next · ' + kindLabel(goals, p.next) + '</div><div class="next">' + escapeHtml(p.next.text) + sub(p.next) + '</div>';
    }
    content.innerHTML = html;
  }

  fetch('/gta-irl/api/state').then(function(r){ return r.json(); }).then(render).catch(function(){});
  var events = new EventSource('/gta-irl/api/events');
  events.onmessage = function(event){
    try { render(JSON.parse(event.data)); } catch(e){}
  };
})();
</script>
</body>
</html>
