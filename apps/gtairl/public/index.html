<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA IRL Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{ --accent:#ff5fa2; --scale:1; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Oswald',sans-serif;display:flex;align-items:flex-start;justify-content:flex-start;height:100vh;padding:28px;color:#fff;text-transform:uppercase;}
  body.bg-preview{background:#5d6b74 linear-gradient(160deg,#8aa0ad,#3c4850);}
  body.right{justify-content:flex-end;text-align:right;}
  body.bottom{align-items:flex-end;}

  /* Only the current mission, on one or two lines, straight on the picture (no box). */
  .mission{opacity:0;transform:scale(var(--scale));transform-origin:top left;transition:opacity .4s ease;}
  .mission.ready{opacity:1;}
  body.right .mission{transform-origin:top right;}
  body.bottom .mission{transform-origin:bottom left;}
  body.bottom.right .mission{transform-origin:bottom right;}
  .mission *{text-shadow:0 1px 2px rgba(0,0,0,.9),0 2px 10px rgba(0,0,0,.6);}

  .line1{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
  body.right .line1{justify-content:flex-end;}
  .label{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--accent);}
  .name{font-size:20px;font-weight:700;letter-spacing:.02em;line-height:1.15;}
  .line2{margin-top:1px;font-size:12px;font-weight:500;letter-spacing:.08em;color:rgba(255,255,255,.88);}
</style>
</head>
<body>
<div class="mission" id="mission"></div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('bg') === 'black' || params.get('bg') === 'preview') document.body.classList.add('bg-preview');
  var demo = params.has('demo');
  var box = document.getElementById('mission');

  // Placement: ?corner=top-right / bottom-left / bottom-right (or ?side=right).
  var corner = (params.get('corner') || '').toLowerCase();
  if (params.get('side') === 'right' || /right/.test(corner)) document.body.classList.add('right');
  if (/bottom/.test(corner)) document.body.classList.add('bottom');

  var KIND = { mission: 'Mission', place: 'Sted', activity: 'Aktivitet' };
  // ?demo shows a made-up mission when nothing has been typed in yet (it never touches the saved list).
  var DEMO = [{ id: 'd1', kind: 'mission', text: 'Det store kup', place: 'Indre by', activity: 'Find skatten', done: false }];

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // "Mission 2" for the second mission; places and activities just say what they are.
  function kindLabel(goals, goal){
    if (goal.kind !== 'mission') return KIND[goal.kind] || '';
    var n = 0, at = 0;
    goals.forEach(function(g){ if (g.kind === 'mission') { n++; if (g.id === goal.id) at = n; } });
    return 'Mission ' + at;
  }

  function render(state){
    var plan = state.plan || {};
    var goals = state.goals || [];
    if (!goals.length && demo) goals = DEMO;
    document.documentElement.style.setProperty('--scale', plan.scale || 1);
    box.classList.add('ready');
    var open = goals.filter(function(g){ return !g.done; });
    if (!goals.length) { box.innerHTML = ''; return; }
    if (!open.length) { box.innerHTML = '<div class="line1"><span class="name">Alle missioner klaret</span></div>'; return; }
    var now = open[0];
    var where = [now.place, now.activity].filter(Boolean).map(escapeHtml).join(' · ');
    box.innerHTML =
      '<div class="line1"><span class="label">' + kindLabel(goals, now) + '</span><span class="name">' + escapeHtml(now.text) + '</span></div>' +
      (where ? '<div class="line2">' + where + '</div>' : '');
  }

  fetch('/gta-irl/api/state').then(function(r){ return r.json(); }).then(render).catch(function(){});
  var events = new EventSource('/gta-irl/api/events');
  events.onmessage = function(event){
    try { render(JSON.parse(event.data)); } catch(e){}
  };
})();
</script>
</body>
</html>
