<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subcount</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
<style>
  /* ===== Redigér udseendet her (eller overstyr via URL: ?color=ff66aa&size=96&font=Bebas+Neue&label=SUBS) ===== */
  :root {
    --font: 'Poppins', system-ui, sans-serif;
    --size: 72px;              /* tekststørrelse */
    --color: #ffffff;          /* tal for subs */
    --goal-color: #c7b6ff;     /* mål + skråstreg */
    --label-color: #c7b6ff;    /* label-tekst */
    --shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.45);
  }
  /* ================================================================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body.bg-preview { background: #141414; }
  body { display: flex; align-items: flex-start; justify-content: flex-start; font-family: var(--font); }

  .subcount {
    margin: 24px;
    display: flex; align-items: baseline; gap: .25em;
    font-size: var(--size); font-weight: 700; line-height: 1;
    color: var(--color); text-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    opacity: 0; transition: opacity .5s ease;
  }
  .subcount.ready { opacity: 1; }
  .subcount .label { font-size: .5em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-color); margin-right: .2em; }
  .subcount .label:empty { display: none; }
  .subcount .sep, .subcount .goal { color: var(--goal-color); }
  .subcount .goal-wrap[hidden] { display: none; }
  .subcount.error .subs { opacity: .55; }
  .subcount.bump .subs { animation: bump 600ms ease; }
  @keyframes bump { 30% { transform: scale(1.18); } }
</style>
</head>
<body>
<div class="subcount" id="root">
  <span class="label" id="label"></span>
  <span class="subs" id="subs">0</span>
  <span class="goal-wrap" id="goalWrap" hidden><span class="sep">/</span> <span class="goal" id="goal">0</span></span>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var root = document.documentElement.style;
  if (params.get('bg') === 'black') document.body.classList.add('bg-preview');
  var hex = /^[0-9a-f]{3,8}$/i;
  [['color','--color'],['goalcolor','--goal-color'],['labelcolor','--label-color']].forEach(function(p){
    var v = params.get(p[0]);
    if (v && hex.test(v)) root.setProperty(p[1], '#' + v);
  });
  var size = Number(params.get('size'));
  if (size > 0 && size < 600) root.setProperty('--size', size + 'px');
  var font = params.get('font');
  if (font && /^[A-Za-z0-9+ ]{2,40}$/.test(font)) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(font).replace(/%2B/g, '+') + ':wght@400;600;700;800&display=swap';
    document.head.appendChild(link);
    root.setProperty('--font', "'" + font.replace(/\+/g, ' ') + "', system-ui, sans-serif");
  }
  document.getElementById('label').textContent = (params.get('label') || '').slice(0, 30);

  var el = { root: document.getElementById('root'), subs: document.getElementById('subs'),
             goal: document.getElementById('goal'), goalWrap: document.getElementById('goalWrap') };
  var last = null;

  function render(s){
    if (s.subs === null || s.subs === undefined) return; // wait for first number from Twitch
    el.root.classList.add('ready');
    el.root.classList.toggle('error', Boolean(s.error));
    if (last !== null && s.subs > last) {
      el.root.classList.remove('bump'); void el.root.offsetWidth; el.root.classList.add('bump');
    }
    last = s.subs;
    el.subs.textContent = s.subs;
    el.goal.textContent = s.goal;
    el.goalWrap.hidden = !(s.goal > 0);
  }

  fetch('/subcount/api/state').then(function(r){ return r.json(); }).then(render).catch(function(){});
  var events = new EventSource('/subcount/api/events');
  events.onmessage = function(e){ try { render(JSON.parse(e.data)); } catch(err){} };
})();
</script>
</body>
</html>
